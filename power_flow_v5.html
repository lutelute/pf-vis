<!DOCTYPE html>
<html lang="ja">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --bg-surface: #1a1a25;
            --accent-blue: #3b82f6;

            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --accent-pink: #ec4899;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #2d2d3d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.4;
            font-size: 13px;
        }
        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 8px 15px;
        }
        .header-content {
            max-width: 1900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { display: flex; align-items: center; gap: 8px; }
        .logo-icon {
            width: 28px; height: 28px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem;
        }
        .logo h1 { font-size: 0.85rem; }
        .container { max-width: 1900px; margin: 0 auto; padding: 8px 10px; }
        .control-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 8px;
        }
        .control-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
        .control-group { display: flex; flex-direction: column; gap: 2px; }
        .control-group label { font-size: 0.6rem; color: var(--text-secondary); }
        .control-group select, .control-group input {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 4px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
        }
        .algo-group { display: flex; flex-wrap: wrap; gap: 3px; }
        .algo-btn {
            padding: 3px 6px;
            border: 2px solid var(--border);
            background: var(--bg-surface);
            color: var(--text-secondary);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.65rem;
            display: flex; align-items: center; gap: 3px;
        }
        .algo-btn.selected { border-color: var(--accent-cyan); background: rgba(6,182,212,0.15); color: var(--text-primary); }
        .algo-dot { width: 6px; height: 6px; border-radius: 50%; }
        .btn {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .btn-primary { background: var(--accent-cyan); color: var(--bg-dark); }
        .btn-secondary { background: var(--bg-surface); color: var(--text-primary); border: 1px solid var(--border); }

        .main-grid { display: grid; grid-template-columns: 220px 1fr 280px; gap: 8px; }
        @media (max-width: 1200px) { .main-grid { grid-template-columns: 1fr; } }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
        }
        .panel h3 { font-size: 0.75rem; margin-bottom: 6px; color: var(--accent-cyan); }
        .panel h4 { font-size: 0.7rem; margin: 8px 0 4px; color: var(--accent-orange); }

        .info-box {
            background: var(--bg-surface);
            border-radius: 4px;
            padding: 6px;
            font-size: 0.65rem;
            margin-top: 6px;
        }
        .info-box p { color: var(--text-secondary); line-height: 1.4; }
        .info-row { display: flex; justify-content: space-between; margin: 2px 0; }
        .info-label { color: var(--text-muted); }
        .info-value { font-family: 'JetBrains Mono', monospace; }
        .info-value.good { color: var(--accent-green); }
        .info-value.warn { color: var(--accent-orange); }
        .info-value.bad { color: var(--accent-red); }

        .center-panel { display: flex; flex-direction: column; gap: 8px; }
        .chart-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .chart-row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
        }
        .chart-header {
            padding: 4px 8px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            font-size: 0.7rem;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;

        .chart-body { height: 180px; padding: 4px; }

        .legend { display: flex; gap: 6px; flex-wrap: wrap; font-size: 0.55rem; }
        .legend-item { display: flex; align-items: center; gap: 2px; }
        .legend-dot { width: 8px; height: 3px; border-radius: 1px; }

        .result-card {
            background: var(--bg-surface);
            border-radius: 4px;
            padding: 6px;
            margin-bottom: 4px;
            border-left: 3px solid var(--border);
        }
        .result-card.converged { border-left-color: var(--accent-green); }
        .result-card.diverged { border-left-color: var(--accent-red); }
        .result-card.running { border-left-color: var(--accent-orange); }
        .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
        .result-name { font-weight: 600; font-size: 0.7rem; display: flex; align-items: center; gap: 4px; }

</head>

<script>
/**
 * Power Flow Algorithm Comparison v5
 *
 * @fileoverview Multi-algorithm power flow comparison visualization tool.
 * Compares convergence characteristics of Newton-Raphson, Fast Decoupled,
 * Gauss-Seidel, DC Power Flow, and additional specialized algorithms.
 *
 * @description Uses the shared PowerFlowEngine and IEEE test case modules,
 * extended with additional algorithms (FDBX, Gauss-Jacobi, Levenberg-Marquardt,
 * HELM) for comprehensive algorithm comparison.
 *
 * @see scripts/power_flow_engine.js - Core power flow engine
 * @see scripts/ieee_cases.js - IEEE standard test cases
 *
 * @author Power Flow Visualization Project
 * @license MIT
 */

// ============================================================
// Algorithm Definitions
// ============================================================

/**
 * Algorithm metadata for all supported power flow methods
 * @type {Object.<string, Object>}
 */
const ALGOS = {
    nr: { name: 'Newton-Raphson', short: 'NR', color: '#3b82f6', desc: '最も高速。雅各法。黄金標準。', matpower: 'newtonpf.m', complexity: 'O(n³)', convergence: '2次' },
    fdxb: { name: 'Fast Decoupled XB', short: 'FDXB', color: '#10b981', desc: 'P-δ/Q-V分離近似。高速。', matpower: 'fdpf.m', complexity: 'O(n³)', convergence: '線形' },
    fdbx: { name: 'Fast Decoupled BX', short: 'FDBX', color: '#14b8a6', desc: 'FDXBの変種。BX順序。', matpower: 'fdpf.m', complexity: 'O(n³)', convergence: '線形' },
    gs: { name: 'Gauss-Seidel', short: 'GS', color: '#f59e0b', desc: '逐次更新。メモリ効率良。収束遅い。', matpower: 'gausspf.m', complexity: 'O(n²)', convergence: '線形' },
    gj: { name: 'Gauss-Jacobi', short: 'GJ', color: '#eab308', desc: '一斉更新。並列化可能。GSより遅い。', matpower: '-', complexity: 'O(n²)', convergence: '線形' },
    dc: { name: 'DC Power Flow', short: 'DC', color: '#8b5cf6', desc: '線形近似。P-δのみ。1回で解。', matpower: 'dcpf.m', complexity: 'O(n²)', convergence: '1回' },
    lm: { name: 'Levenberg-Marquardt', short: 'LM', color: '#ec4899', desc: 'NRにダンピング追加。収束性改善。', matpower: '-', complexity: 'O(n³)', convergence: '超線形' },
    helm: { name: 'Holomorphic Embedding', short: 'HELM', color: '#6366f1', desc: '複素解析的手法。収束保証あり。', matpower: '-', complexity: 'O(n³)', convergence: '保証' }
};

// ============================================================
// Case Mapping - IEEE Standard Cases from Shared Module
// ============================================================

/**
 * Maps dropdown values to IEEE case data objects from the shared module
 * @type {Object.<string, Object>}
 */
const CASE_MAP = {
    case5: IEEE_5_BUS,
    case9: IEEE_9_BUS,
    case14: IEEE_14_BUS,
    case30: IEEE_30_BUS
};

/**
 * Dynamic cases container (for generated cases)
 * @type {Object.<string, Object>}
 */
const CASES = {};

// ============================================================
// IEEE 57-Bus and 118-Bus Case Generators
// ============================================================

/**
 * Generate IEEE 57-bus test case
 *
 * @description Creates a realistic IEEE 57-bus system with proper topology
 * and impedance values. This case is procedurally generated as it's not
 * included in the base ieee_cases.js module.
 *
 * @returns {Object} MATPOWER-compatible case data
 */
function generateIEEE57() {
    const baseMVA = 100;
    const nBus = 57;
    const buses = [];
    const gens = [];
    const branches = [];

    // Generator buses in IEEE 57-bus (approximately)
    const genBuses = new Set([1, 2, 3, 6, 8, 9, 12]);

    // Load pattern - total approximately 1250 MW
    const loadPattern = [0,0,40,0,13,75,0,150,0,5,0,0,18,10.5,22,43,42,27.2,3.3,2.3,0,0,6.3,0,6.3,0,9.3,4.6,17,3.6,5.8,1.6,3.8,0,6,0,0,14,0,0,0,7.1,2,11.2,0,0,29.7,0,18,21,0,18,4.9,20,4.6,6.8,0];
    const qPattern = loadPattern.map(p => p * 0.3);

    for (let i = 1; i <= nBus; i++) {
        const isGen = genBuses.has(i);
        const type = i === 1 ? 3 : (isGen ? 2 : 1);
        const Pd = loadPattern[i-1] || 0;
        const Qd = qPattern[i-1] || 0;
        const Vm = isGen ? 1.0 + (i === 1 ? 0.04 : 0.02) : 1.0;
        buses.push([i, type, Pd, Qd, 0, 0, 1, Vm, 0, 230, 1, 1.1, 0.9]);
    }

    // Generators
    const genPower = [128.9, 0, 40, 0, 450, 0, 310];
    const genVm = [1.04, 1.01, 0.985, 0.98, 1.005, 0.98, 1.015];
    let gi = 0;
    for (const g of genBuses) {

/**
 * Generate random power system case
 *
 * @description Creates a random power system with realistic network topology.
 * Uses spanning tree for connectivity plus mesh connections.
 *
 * @param {number} nBus - Number of buses
 * @param {number} [qpRatio=0.3] - Reactive to active power ratio
 * @returns {Object} MATPOWER-compatible case data
 */
function generateRandomCase(nBus, qpRatio = 0.3) {
    const baseMVA = 100;
    const buses = [], gens = [], branches = [];

    // Seeded random for reproducibility
    let seed = nBus * 12345;
    const rand = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };

    // Generator buses (about 15%, min 3)
    const nGen = Math.max(3, Math.floor(nBus * 0.15));
    const genBuses = new Set([1]);
    const step = Math.floor(nBus / nGen);
    for (let i = 1; i < nGen; i++) {
        genBuses.add(Math.min(1 + i * step, nBus));
    }

    // Create buses
    let totalPd = 0, totalQd = 0;
    for (let i = 1; i <= nBus; i++) {
        const isGen = genBuses.has(i);
        const type = i === 1 ? 3 : (isGen ? 2 : 1);

        const Pd = isGen ? 5 + rand() * 10 : 20 + rand() * 40;
        const Qd = Pd * qpRatio * (0.8 + rand() * 0.4);
        totalPd += Pd;
        totalQd += Qd;

        buses.push([i, type, Pd, Qd, 0, 0, 1, 1.0, 0, 230, 1, 1.1, 0.9]);
    }

    // Generators
    const targetPg = totalPd * 1.1;
    const pgPerGen = targetPg / (genBuses.size - 1);

    for (const g of genBuses) {
        if (g === 1) {
            gens.push([1, 0, 0, 500, -300, 1.04, 100, 1, 600, 0]);
            buses[0][7] = 1.04;
        } else {
            const Pg = pgPerGen * (0.9 + rand() * 0.2);
            const Vm = 1.01 + rand() * 0.02;
            gens.push([g, Pg, 0, 300, -150, Vm, 100, 1, 400, 0]);
            buses[g-1][7] = Vm;
        }
    }

    // Build spanning tree
    const connected = new Set([1]);
    const unconnected = new Set();
    for (let i = 2; i <= nBus; i++) unconnected.add(i);

    while (unconnected.size > 0) {
        const fromArr = [...unconnected];
        const from = fromArr[Math.floor(rand() * fromArr.length)];
        const toArr = [...connected].sort((a, b) => Math.abs(a - from) - Math.abs(b - from));
        const to = toArr[0];

        const dist = Math.abs(from - to);
        const r = 0.01 + 0.005 * dist + rand() * 0.01;
        const x = 0.03 + 0.02 * dist + rand() * 0.02;
        const b = 0.02 + rand() * 0.02;

        branches.push([Math.min(from, to), Math.max(from, to), r, x, b, 200, 200, 200, 0, 0, 1]);
        connected.add(from);
        unconnected.delete(from);
    }

    // Add mesh connections
    const nMesh = Math.floor(nBus * 0.3);
    let meshAdded = 0;
    for (let attempts = 0; attempts < nMesh * 5 && meshAdded < nMesh; attempts++) {
        const i = Math.floor(rand() * nBus) + 1;
        const j = Math.floor(rand() * nBus) + 1;
        if (i === j) continue;

        const mi = Math.min(i, j), ma = Math.max(i, j);
        if (ma - mi > Math.ceil(nBus / 4)) continue;
        if (branches.some(br => br[0] === mi && br[1] === ma)) continue;

        const r = 0.01 + rand() * 0.02;
        const x = 0.04 + rand() * 0.04;
        const b = 0.02 + rand() * 0.02;

        branches.push([mi, ma, r, x, b, 200, 200, 200, 0, 0, 1]);
        meshAdded++;
    }

    return { name: `Random ${nBus}-bus`, baseMVA, bus: buses, gen: gens, branch: branches };
}

/**
 * Extended Power Flow Engine with additional algorithms
 *
 * @class
 * @extends PowerFlowEngine
 * @description Extends the shared PowerFlowEngine with additional algorithms:
 * Fast Decoupled BX, Gauss-Jacobi, Levenberg-Marquardt, and HELM.
 */
class ExtendedPowerFlowEngine extends PowerFlowEngine {
    /**
     * Create an ExtendedPowerFlowEngine instance
     * @param {Object} caseData - MATPOWER-compatible case data
     */
    constructor(caseData) {
        super(caseData);
        this.diverged = false;
    }

    /**
     * Reset the engine state
     */
    reset() {
        // Re-initialize using parent's constructor logic
        this._initialize();
        this.iteration = 0;
        this.converged = false;
        this.diverged = false;
        this.errorHistory = [];
    }

    /**
     * Run one iteration of the specified algorithm
     *
     * @param {string} algo - Algorithm key: 'nr', 'fdxb', 'fdbx', 'gs', 'gj', 'dc', 'lm', 'helm'
     * @returns {Object} Result with maxError property
     */
    runIteration(algo) {
        this.iteration++;
        let result;

        switch (algo) {
            case 'nr':
                result = this._solveNewtonRaphsonStep();
                break;
            case 'fdxb':
                result = this._solveFastDecoupledStep();
                break;
            case 'fdbx':
                result = this._solveFDBXStep();
                break;
            case 'gs':
                result = this._solveGaussSeidelStep();
                break;
            case 'gj':
                result = this._solveGaussJacobiStep();
                break;
            case 'dc':
                this._solveDC();
                this.converged = true;
                result = { maxError: 0 };
                break;
            case 'lm':
                result = this._solveLevenbergMarquardtStep();
                break;
            case 'helm':
                result = this._solveHELMStep();
                break;
            default:
                result = this._solveNewtonRaphsonStep();
        }

        this.maxError = result.maxError;
        this.errorHistory.push({
            iter: this.iteration,
            iteration: this.iteration,
            error: result.maxError,
            max: result.maxError
        });

        if (!isFinite(result.maxError)) {
            this.diverged = true;
        }

        return result;
    }

    /**
     * Fast Decoupled BX step (Q-V first, then P-delta)
     * @private
     * @returns {Object} Result with maxError
     */
    _solveFDBXStep() {
        const mismatch = this._calcMismatch();

        // Q-V first
        if (mismatch.deltaQ.length > 0) {
            const Bpp = this._buildBMatrix(mismatch.deltaQ.map(d => d.bus));
            const fq = mismatch.deltaQ.map(d => d.value / this.V[d.bus]);
            const dV = this._solveLU(Bpp, fq);
            if (dV && dV.every(v => isFinite(v))) {
                for (let i = 0; i < mismatch.deltaQ.length; i++) {
                    this.V[mismatch.deltaQ[i].bus] = Math.max(0.5, Math.min(1.5, this.V[mismatch.deltaQ[i].bus] + dV[i]));
                }
            }
        }

        // P-delta second
        if (mismatch.deltaP.length > 0) {
            const Bp = this._buildBMatrix(mismatch.deltaP.map(d => d.bus));
            const fp = mismatch.deltaP.map(d => d.value / this.V[d.bus]);
            const dDelta = this._solveLU(Bp, fp);
            if (dDelta && dDelta.every(v => isFinite(v))) {
                for (let i = 0; i < mismatch.deltaP.length; i++) {
                    this.delta[mismatch.deltaP[i].bus] += dDelta[i];
                }
            }
        }

        const m = this._calcMismatch();
        const maxP = m.deltaP.length > 0 ? Math.max(...m.deltaP.map(d => Math.abs(d.value))) : 0;
        const maxQ = m.deltaQ.length > 0 ? Math.max(...m.deltaQ.map(d => Math.abs(d.value))) : 0;
        return { maxError: Math.max(maxP, maxQ) };
    }

    /**
     * Gauss-Jacobi step (simultaneous update)
     * @private
     * @returns {Object} Result with maxError
     */
    _solveGaussJacobiStep() {
        const mismatch = this._calcMismatch();
        const newV = [...this.V];
        const newDelta = [...this.delta];

        for (let i = 0; i < this.nBus; i++) {
            if (i === this.slackBus) continue;

            const Pspec = this.Pgen[i] - this.busData[i][2] / this.baseMVA;
            const Qspec = this.pqBuses.includes(i) ? (this.Qgen[i] - this.busData[i][3] / this.baseMVA) : 0;

            let sumYV_re = 0, sumYV_im = 0;
            for (let j = 0; j < this.nBus; j++) {
                if (j === i) continue;
                const Vj_re = this.V[j] * Math.cos(this.delta[j]);
                const Vj_im = this.V[j] * Math.sin(this.delta[j]);
                sumYV_re += this.Ybus.re[i][j] * Vj_re - this.Ybus.im[i][j] * Vj_im;
                sumYV_im += this.Ybus.re[i][j] * Vj_im + this.Ybus.im[i][j] * Vj_re;
            }

            const Vi_re = this.V[i] * Math.cos(this.delta[i]);
            const Vi_im = this.V[i] * Math.sin(this.delta[i]);
            const Vmag2 = this.V[i] * this.V[i];

            const Yii_mag2 = this.Ybus.re[i][i] ** 2 + this.Ybus.im[i][i] ** 2;
            if (Yii_mag2 < 1e-12) continue;

            const SoverVconj_re = (Pspec * Vi_re + Qspec * Vi_im) / Vmag2;
            const SoverVconj_im = (Pspec * Vi_im - Qspec * Vi_re) / Vmag2;

            const rhs_re = SoverVconj_re - sumYV_re;
            const rhs_im = SoverVconj_im - sumYV_im;

            const calcV_re = (rhs_re * this.Ybus.re[i][i] + rhs_im * this.Ybus.im[i][i]) / Yii_mag2;
            const calcV_im = (rhs_im * this.Ybus.re[i][i] - rhs_re * this.Ybus.im[i][i]) / Yii_mag2;

            newDelta[i] = Math.atan2(calcV_im, calcV_re);
            if (this.pqBuses.includes(i)) {
                newV[i] = Math.max(0.5, Math.min(1.5, Math.sqrt(calcV_re * calcV_re + calcV_im * calcV_im)));
            }
        }

        // Apply all updates at once
        for (let i = 0; i < this.nBus; i++) {
            this.V[i] = newV[i];
            this.delta[i] = newDelta[i];
        }

        const maxP = mismatch.deltaP.length > 0 ? Math.max(...mismatch.deltaP.map(d => Math.abs(d.value))) : 0;
        const maxQ = mismatch.deltaQ.length > 0 ? Math.max(...mismatch.deltaQ.map(d => Math.abs(d.value))) : 0;
        return { maxError: Math.max(maxP, maxQ) };
    }

    /**
     * Levenberg-Marquardt step (damped Newton-Raphson)
     * @private
     * @returns {Object} Result with maxError
     */
    _solveLevenbergMarquardtStep() {
        const mismatch = this._calcMismatch();
        const n = mismatch.deltaP.length + mismatch.deltaQ.length;
        if (n === 0) return { maxError: 0 };

        const J = this._buildJacobian(mismatch.deltaP, mismatch.deltaQ);
        const f = [...mismatch.deltaP.map(d => d.value), ...mismatch.deltaQ.map(d => d.value)];

        // Add damping (Levenberg-Marquardt regularization)
        const lambda = 0.01;
        for (let i = 0; i < n; i++) {
            J[i][i] += lambda;
        }

        const dx = this._solveLU(J, f);
        if (!dx || dx.some(v => !isFinite(v))) {
            return { maxError: Infinity };
        }

        let idx = 0;
        for (const dp of mismatch.deltaP) {
            let dDelta = dx[idx++];
            if (Math.abs(dDelta) > 0.5) dDelta = 0.5 * Math.sign(dDelta);
            this.delta[dp.bus] += dDelta;
        }
        for (const dq of mismatch.deltaQ) {
            let dV = dx[idx++];
            if (Math.abs(dV) > 0.1) dV = 0.1 * Math.sign(dV);
            this.V[dq.bus] = Math.max(0.5, Math.min(1.5, this.V[dq.bus] + dV));
        }

        const maxP = mismatch.deltaP.length > 0 ? Math.max(...mismatch.deltaP.map(d => Math.abs(d.value))) : 0;
        const maxQ = mismatch.deltaQ.length > 0 ? Math.max(...mismatch.deltaQ.map(d => Math.abs(d.value))) : 0;
        return { maxError: Math.max(maxP, maxQ) };
    }

    /**
     * HELM step (Holomorphic Embedding - simplified NR with relaxation)
     * @private
     * @returns {Object} Result with maxError
     */
    _solveHELMStep() {
        const mismatch = this._calcMismatch();
        const f = [...mismatch.deltaP.map(d => d.value), ...mismatch.deltaQ.map(d => d.value)];
        if (f.length === 0) return { maxError: 0 };

        const J = this._buildJacobian(mismatch.deltaP, mismatch.deltaQ);
        const dx = this._solveLU(J, f);
        if (!dx || dx.some(v => !isFinite(v))) return { maxError: Infinity };

        // Relaxation for stability
        const alpha = 0.8;
        let idx = 0;
        for (const dp of mismatch.deltaP) {
            this.delta[dp.bus] += alpha * dx[idx++];
        }
        for (const dq of mismatch.deltaQ) {
            this.V[dq.bus] += alpha * dx[idx++];
            this.V[dq.bus] = Math.max(0.5, Math.min(1.5, this.V[dq.bus]));
        }

        const maxP = mismatch.deltaP.length > 0 ? Math.max(...mismatch.deltaP.map(d => Math.abs(d.value))) : 0;
        const maxQ = mismatch.deltaQ.length > 0 ? Math.max(...mismatch.deltaQ.map(d => Math.abs(d.value))) : 0;
        return { maxError: Math.max(maxP, maxQ) };
    }

    /**
     * Calculate power at all buses
     * @returns {Object} Object with P and Q arrays
     */
    calcPower() {
        return this._calcPowerInjection();
    }
}

let engines = {};

/** @type {Array<string>} */
let selectedAlgos = ['nr', 'fdxb', 'dc'];

/** @type {boolean} */
let running = false;

/** @type {Object|null} */
let currentCase = null;

// ============================================================
// Helper Functions
// ============================================================

/**
 * Get case data by name
 *
 * @param {string} name - Case name (e.g., 'case9', 'random30')
 * @returns {Object} MATPOWER-compatible case data
 */
function getCaseData(name) {
    if (CASE_MAP[name]) {
        return CASE_MAP[name];
    }
    return CASES[name] || null;
}

// ============================================================
// Tab Management
// ============================================================

/**
 * Switch to specified tab
 * @param {string} id - Tab identifier
 */
function showTab(id) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelector(`.tab-btn[onclick="showTab('${id}')"]`).classList.add('active');
    document.getElementById(`tab-${id}`).classList.add('active');
}

// ============================================================
// Initialization
// ============================================================

/**
 * Initialize the application
 */
function init() {
    buildAlgoButtons();
    document.getElementById('caseSelect').addEventListener('change', loadCase);
    document.getElementById('qpRatio').addEventListener('change', regenerateRandom);
    document.getElementById('runBtn').addEventListener('click', runAll);
    document.getElementById('resetBtn').addEventListener('click', reset);
    loadCase();
}

/**
 * Build algorithm selection buttons
 */
function buildAlgoButtons() {
    const container = document.getElementById('algoGroup');
    container.innerHTML = '';
    for (const [key, algo] of Object.entries(ALGOS)) {
        const btn = document.createElement('div');
        btn.className = 'algo-btn' + (selectedAlgos.includes(key) ? ' selected' : '');
        btn.dataset.algo = key;
        btn.innerHTML = `<span class="algo-dot" style="background:${algo.color}"></span>${algo.short}`;
        btn.onclick = () => toggleAlgo(key, btn);
        container.appendChild(btn);
    }
}

/**
 * Toggle algorithm selection
 *
 * @param {string} key - Algorithm key
 * @param {HTMLElement} btn - Button element
 */
function toggleAlgo(key, btn) {
    if (selectedAlgos.includes(key)) {
        if (selectedAlgos.length > 1) {
            selectedAlgos = selectedAlgos.filter(a => a !== key);
            btn.classList.remove('selected');
        }
    } else {
        selectedAlgos.push(key);
        btn.classList.add('selected');
    }
    reset();
}

/**
 * Regenerate random cases with new Q/P ratio
 */
function regenerateRandom() {
    const qpRatio = parseFloat(document.getElementById('qpRatio').value);
    CASES.random30 = generateRandomCase(30, qpRatio);
    CASES.random50 = generateRandomCase(50, qpRatio);
    CASES.random100 = generateRandomCase(100, qpRatio);
    loadCase();
}

/**
 * Load selected case
 */
function loadCase() {
    const name = document.getElementById('caseSelect').value;
    currentCase = getCaseData(name);
    reset();
    updateCaseInfo();
    diagnoseCaseData();
}

/**
 * Update case information display
 */
function updateCaseInfo() {
    let totalPd = 0, totalQd = 0, totalPg = 0;
    for (const bus of currentCase.bus) {
        totalPd += bus[2] || 0;
        totalQd += bus[3] || 0;
    }
    for (const gen of currentCase.gen) {
        totalPg += gen[1] || 0;
    }

    const qpRatio = totalPd > 0 ? (totalQd / totalPd).toFixed(2) : 0;
    const slackSupply = totalPd - totalPg;

    document.getElementById('caseInfo').innerHTML = `
        <div class="info-row"><span class="info-label">名前</span><span class="info-value">${currentCase.name}</span></div>
        <div class="info-row"><span class="info-label">ノード数</span><span class="info-value">${currentCase.bus.length}</span></div>
        <div class="info-row"><span class="info-label">ブランチ数</span><span class="info-value">${currentCase.branch.length}</span></div>
        <div class="info-row"><span class="info-label">発電機数</span><span class="info-value">${currentCase.gen.length}</span></div>
        <div class="info-row"><span class="info-label">総負荷</span><span class="info-value">${totalPd.toFixed(0)} MW</span></div>
        <div class="info-row"><span class="info-label">総発電</span><span class="info-value">${totalPg.toFixed(0)} MW</span></div>
        <div class="info-row"><span class="info-label">Q/P比</span><span class="info-value">${qpRatio}</span></div>
        <div class="info-row"><span class="info-label">Slack供給</span><span class="info-value ${Math.abs(slackSupply) > totalPd * 0.5 ? 'warn' : 'good'}">${slackSupply.toFixed(0)} MW</span></div>
    `;
}

/**
 * Diagnose case data for potential issues
 */
function diagnoseCaseData() {
    const diag = [];
    let hasIssue = false;

    // Power balance check
    let totalPd = 0, totalPg = 0;
    for (const bus of currentCase.bus) totalPd += bus[2] || 0;
    for (const gen of currentCase.gen) totalPg += gen[1] || 0;

    const slackRatio = (totalPd - totalPg) / totalPd;
    if (Math.abs(slackRatio) > 0.5) {
        diag.push(`<span class="info-value warn">⚠ Slack供給 ${(slackRatio * 100).toFixed(0)}%</span>`);
        hasIssue = true;
    }

    // Check for isolated buses
    const connected = new Set();
    for (const br of currentCase.branch) {
        connected.add(br[0]);
        connected.add(br[1]);
    }
    const isolated = currentCase.bus.filter((_, i) => !connected.has(i + 1));
    if (isolated.length > 0) {
        diag.push(`<span class="info-value bad">✗ 孤立バス: ${isolated.length}</span>`);
        hasIssue = true;
    }

    // Check voltage settings
    let badVoltage = 0;
    for (const bus of currentCase.bus) {
        if (bus[7] < 0.8 || bus[7] > 1.2) badVoltage++;
    }
    if (badVoltage > 0) {
        diag.push(`<span class="info-value warn">⚠ 異常電圧設定: ${badVoltage}</span>`);
        hasIssue = true;
    }

    if (!hasIssue) {
        diag.push(`<span class="info-value good">✓ 問題なし</span>`);
    }

    document.getElementById('diagInfo').innerHTML = diag.join('<br>');
}

/**
 * Reset all engines
 */
function reset() {
    running = false;
    engines = {};
    for (const algo of selectedAlgos) {
        engines[algo] = new ExtendedPowerFlowEngine(currentCase);
    }
    updateResults();
    drawAll();
}

/**
 * Run all selected algorithms
 */
async function runAll() {
    if (running) return;
    running = true;

    const tol = parseFloat(document.getElementById('tolSelect').value);
    const maxIter = parseInt(document.getElementById('maxIterInput').value);
    const speed = parseFloat(document.getElementById('speedSelect').value);

    document.getElementById('runBtn').disabled = true;

    while (running) {
        let allDone = true;

        for (const algo of selectedAlgos) {
            const e = engines[algo];
            if (e.converged || e.diverged || e.iteration >= maxIter) continue;

            allDone = false;
            const result = e.runIteration(algo);

            if (result.maxError < tol) {
                e.converged = true;
            } else if (e.iteration >= maxIter || !isFinite(result.maxError)) {
                e.diverged = true;
            }
        }

        updateResults();
        drawAll();

        if (allDone) break;
        if (speed > 0) await new Promise(r => setTimeout(r, 100 / speed));
    }

    running = false;
    document.getElementById('runBtn').disabled = false;
    updateDCAnalysis();
    updateQAnalysis();
}

/**
 * Update results display
 */
function updateResults() {
    const container = document.getElementById('algoResults');
    container.innerHTML = '';

    for (const algo of selectedAlgos) {
        const e = engines[algo];
        const info = ALGOS[algo];

        let status = 'waiting', statusText = '待機';
        if (e.converged) { status = 'converged'; statusText = '収束'; }
        else if (e.diverged) { status = 'diverged'; statusText = '発散'; }
        else if (e.iteration > 0) { status = 'running'; statusText = '実行中'; }

        container.innerHTML += `
            <div class="result-card ${status}">
                <div class="result-header">
                    <span class="result-name">
                        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${info.color}"></span>
                        ${info.short}
                    </span>
                    <span class="result-status ${status}">${statusText}</span>
                </div>
                <div class="result-stats">
                    <span>反復: ${e.iteration}</span>
                    <span>誤差: ${isFinite(e.maxError) ? e.maxError.toExponential(1) : '∞'}</span>
                </div>
            </div>
        `;
    }

    // Update legend
    document.getElementById('legend').innerHTML = selectedAlgos.map(a =>
        `<div class="legend-item"><span class="legend-dot" style="background:${ALGOS[a].color}"></span>${ALGOS[a].short}</div>`
    ).join('');

    // Update comparison table
    const tbody = document.getElementById('comparisonBody');
    tbody.innerHTML = '';

    const results = [];
    for (const algo of selectedAlgos) {
        const engine = engines[algo];
        const algoInfo = ALGOS[algo];

        let status = 'waiting';
        let statusText = '待機中';
        if (engine.converged) { status = 'converged'; statusText = '✓ 収束'; }
        else if (engine.diverged) { status = 'diverged'; statusText = '✗ 発散'; }
        else if (engine.iteration > 0) { status = 'running'; statusText = '⏳ 実行中'; }

        results.push({
            algo,
            name: algoInfo.short,
            color: algoInfo.color,
            iteration: engine.iteration,
            error: Math.max(engine.maxError || 0),
            status,
            statusText,
            converged: engine.converged,
            matpower: algoInfo.matpower || '-'
        });
    }

    const sorted = [...results].filter(r => r.converged).sort((a, b) => a.iteration - b.iteration);

    results.forEach(r => {
        const rank = sorted.findIndex(s => s.algo === r.algo);
        const rankClass = rank === 0 ? 'rank-1' : rank === 1 ? 'rank-2' : rank === 2 ? 'rank-3' : '';
        const matpowerClass = r.matpower !== '-' ? 'matpower-yes' : 'matpower-no';

        tbody.innerHTML += `
            <tr>
                <td>
                    <span class="algo-dot" style="background: ${r.color}; width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px;"></span>
                    ${r.name}
                </td>
                <td class="${rankClass}">${r.iteration}</td>
                <td>${isFinite(r.error) ? r.error.toExponential(1) : '∞'}</td>
                <td>${r.statusText}</td>
                <td class="${matpowerClass}">${r.matpower}</td>
            </tr>
        `;
    });
}

/**
 * Update DC power flow accuracy analysis
 */
function updateDCAnalysis() {
    const dcE = engines['dc'];
    const acAlgo = ['nr', 'fdxb', 'fdbx', 'lm'].find(a => engines[a] && engines[a].converged);

    if (!dcE || !acAlgo) {
        document.getElementById('dcMetrics').innerHTML = '<div class="metric"><div class="metric-value">-</div><div class="metric-label">AC解が必要</div></div>';
        document.getElementById('dcErrors').innerHTML = '';
        return;
    }

    const acE = engines[acAlgo];
    let sumErr = 0, maxErr = 0;
    const errors = [];

    for (let i = 0; i < dcE.nBus; i++) {
        const dAC = acE.delta[i] * 180 / Math.PI;
        const dDC = dcE.delta[i] * 180 / Math.PI;
        const err = Math.abs(dDC - dAC);
        sumErr += err;
        maxErr = Math.max(maxErr, err);
        errors.push({ bus: i + 1, err: err.toFixed(3) });
    }

    const avgErr = sumErr / dcE.nBus;

    document.getElementById('dcMetrics').innerHTML = `
        <div class="metric ${avgErr < 1 ? 'good' : avgErr < 5 ? 'warn' : 'bad'}">
            <div class="metric-value">${avgErr.toFixed(2)}°</div>
            <div class="metric-label">平均誤差</div>
        </div>
        <div class="metric ${maxErr < 3 ? 'good' : maxErr < 10 ? 'warn' : 'bad'}">
            <div class="metric-value">${maxErr.toFixed(2)}°</div>
            <div class="metric-label">最大誤差</div>
        </div>
    `;

    errors.sort((a, b) => parseFloat(b.err) - parseFloat(a.err));
    document.getElementById('dcErrors').innerHTML = `
        <table>
            <tr><th>Bus</th><th class="num">誤差[°]</th></tr>
            ${errors.slice(0, 10).map(e => `<tr><td>${e.bus}</td><td class="num">${e.err}</td></tr>`).join('')}
        </table>
    `;
}

/**
 * Update reactive power analysis
 */
function updateQAnalysis() {
    const acAlgo = ['nr', 'fdxb', 'fdbx', 'lm'].find(a => engines[a] && engines[a].converged);

    if (!acAlgo) {
        document.getElementById('qMetrics').innerHTML = '<div class="metric"><div class="metric-value">-</div><div class="metric-label">AC解が必要</div></div>';
        document.getElementById('highQBuses').innerHTML = '';
        return;
    }

    const e = engines[acAlgo];
    const power = e.calcPower();

    let totalQ = 0, maxQ = 0;
    const highQ = [];

    for (let i = 0; i < e.nBus; i++) {
        const Q = power.Q[i] * e.baseMVA;
        const absQ = Math.abs(Q);
        totalQ += absQ;
        maxQ = Math.max(maxQ, absQ);
        if (absQ > 10) {
            highQ.push({ bus: i + 1, Q: Q.toFixed(1) });
        }
    }

    document.getElementById('qMetrics').innerHTML = `
        <div class="metric">
            <div class="metric-value">${totalQ.toFixed(0)}</div>
            <div class="metric-label">総Q [Mvar]</div>
        </div>
        <div class="metric ${maxQ < 50 ? 'good' : maxQ < 100 ? 'warn' : 'bad'}">
            <div class="metric-value">${maxQ.toFixed(1)}</div>
            <div class="metric-label">最大Q</div>
        </div>
    `;

    highQ.sort((a, b) => Math.abs(parseFloat(b.Q)) - Math.abs(parseFloat(a.Q)));
    document.getElementById('highQBuses').innerHTML = highQ.length > 0 ? `
        <table>
            <tr><th>Bus</th><th class="num">Q [Mvar]</th></tr>
            ${highQ.slice(0, 8).map(h => `<tr><td>${h.bus}</td><td class="num">${h.Q}</td></tr>`).join('')}
        </table>
    ` : '<p style="color:var(--accent-green);font-size:0.65rem;">高Q流通バスなし</p>';
}

/**
 * Draw all charts
 */
function drawAll() {
    drawConvergence();
    drawIterationBar();
    drawVoltageCompare();
    drawAngleCompare();
    drawVoltageError();
    drawQDistribution();
    drawDCAccuracy();
}

/**
 * Draw convergence curves
 */
function drawConvergence() {
    const canvas = document.getElementById('convergenceCanvas');
    const ctx = canvas.getContext('2d');
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width - 8;
    canvas.height = rect.height - 8;

    const w = canvas.width, h = canvas.height;
    const pad = { top: 10, right: 10, bottom: 20, left: 40 };

    ctx.fillStyle = '#12121a';
    ctx.fillRect(0, 0, w, h);

    const tol = parseFloat(document.getElementById('tolSelect').value);

    // Collect data
    let allData = [];
    let maxIter = 1;
    for (const a of selectedAlgos) {
        if (a === 'dc') continue;
        const hist = engines[a].errorHistory;
        if (hist.length > 0) {
            allData.push(...hist.map(h => h.error).filter(v => isFinite(v) && v > 0));
            maxIter = Math.max(maxIter, engines[a].iteration);
        }
    }

    if (allData.length === 0) {
        ctx.fillStyle = '#64748b';
        ctx.font = '10px JetBrains Mono';
        ctx.textAlign = 'center';
        ctx.fillText('実行すると表示', w / 2, h / 2);
        return;
    }

    const minLog = Math.min(Math.log10(tol) - 1, ...allData.map(d => Math.log10(d))) - 0.5;
    const maxLog = Math.max(...allData.map(d => Math.log10(d))) + 0.5;

    const pW = w - pad.left - pad.right;
    const pH = h - pad.top - pad.bottom;

    // Tolerance line
    const tolY = pad.top + (maxLog - Math.log10(tol)) / (maxLog - minLog) * pH;
    ctx.strokeStyle = 'rgba(239,68,68,0.5)';
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(pad.left, tolY);
    ctx.lineTo(w - pad.right, tolY);
    ctx.stroke();
    ctx.setLineDash([]);

    // Draw curves
    for (const a of selectedAlgos) {
        if (a === 'dc') continue;
        const hist = engines[a].errorHistory.filter(h => isFinite(h.error) && h.error > 0);
        if (hist.length === 0) continue;

        ctx.strokeStyle = ALGOS[a].color;
        ctx.lineWidth = 2;
        ctx.beginPath();

        hist.forEach((h, i) => {
            const x = pad.left + (h.iter / maxIter) * pW;
            const y = pad.top + (maxLog - Math.log10(h.error)) / (maxLog - minLog) * pH;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        });
        ctx.stroke();
    }

    // Labels
    ctx.fillStyle = '#94a3b8';
    ctx.font = '8px JetBrains Mono';
    ctx.textAlign = 'center';
    ctx.fillText('反復', w / 2, h - 3);
}

/**
 * Draw iteration count bar chart
 */
function drawIterationBar() {
    const canvas = document.getElementById('iterCanvas');
    const ctx = canvas.getContext('2d');
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width - 8;
    canvas.height = rect.height - 8;

    const w = canvas.width, h = canvas.height;
    const pad = { top: 15, right: 10, bottom: 25, left: 30 };

    ctx.fillStyle = '#12121a';
    ctx.fillRect(0, 0, w, h);

    const pW = w - pad.left - pad.right;
    const pH = h - pad.top - pad.bottom;

    const maxIter = Math.max(...selectedAlgos.map(a => engines[a].iteration), 1);
    const barW = Math.min(pW / selectedAlgos.length - 4, 30);
    const gap = (pW - barW * selectedAlgos.length) / (selectedAlgos.length + 1);

    selectedAlgos.forEach((a, i) => {
        const e = engines[a];
        const x = pad.left + gap + i * (barW + gap);
        const iter = a === 'dc' ? 1 : e.iteration;
        const barH = (iter / maxIter) * pH;
        const y = pad.top + pH - barH;

        ctx.fillStyle = ALGOS[a].color;
        ctx.fillRect(x, y, barW, barH);

        ctx.fillStyle = '#f1f5f9';
        ctx.font = 'bold 9px JetBrains Mono';
        ctx.textAlign = 'center';
        ctx.fillText(iter, x + barW / 2, y - 2);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '8px JetBrains Mono';
        ctx.fillText(ALGOS[a].short, x + barW / 2, h - pad.bottom + 10);
        ctx.fillText(e.converged ? '✓' : e.diverged ? '✗' : '', x + barW / 2, h - pad.bottom + 18);
    });
}

/**
 * Draw voltage profile comparison
 */
function drawVoltageCompare() {
    const canvas = document.getElementById('voltageCompareCanvas');
    const ctx = canvas.getContext('2d');
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width - 8;
    canvas.height = rect.height - 8;

    const w = canvas.width, h = canvas.height;
    const pad = { top: 20, right: 60, bottom: 25, left: 40 };

    ctx.fillStyle = '#12121a';
    ctx.fillRect(0, 0, w, h);

    // Collect voltage data
    const voltageData = {};
    let nBus = 0;
    let hasData = false;

    for (const algo of selectedAlgos) {
        const e = engines[algo];
        if (e && (e.converged || e.iteration > 0)) {
            voltageData[algo] = [...e.V];
            nBus = e.nBus;
            hasData = true;
        }
    }

    if (!hasData) {
        ctx.fillStyle = '#64748b';
        ctx.font = '10px JetBrains Mono';
        ctx.textAlign = 'center';
        ctx.fillText('実行すると電圧プロファイルを表示', w / 2, h / 2);
        return;
    }

    // Find range
    let minV = 1.0, maxV = 1.0;
    for (const algo in voltageData) {
        const V = voltageData[algo];
        minV = Math.min(minV, ...V);
        maxV = Math.max(maxV, ...V);
    }
    minV = Math.min(minV - 0.02, 0.9);
    maxV = Math.max(maxV + 0.02, 1.1);

    const pW = w - pad.left - pad.right;
    const pH = h - pad.top - pad.bottom;
    const range = maxV - minV;

    // V=1.0 line
    const v10Y = pad.top + (maxV - 1.0) / range * pH;
    ctx.strokeStyle = 'rgba(239,68,68,0.4)';
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(pad.left, v10Y);
    ctx.lineTo(w - pad.right, v10Y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Draw lines for each algorithm
    for (const algo of selectedAlgos) {
        if (!voltageData[algo]) continue;
        const V = voltageData[algo];

        ctx.strokeStyle = ALGOS[algo].color;
        ctx.lineWidth = algo === 'gs' ? 2.5 : 1.5;
        ctx.beginPath();

        for (let i = 0; i < nBus; i++) {
            const x = pad.left + (i + 0.5) / nBus * pW;
            const y = pad.top + (maxV - V[i]) / range * pH;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    // Axes
    ctx.fillStyle = '#94a3b8';
    ctx.font = '8px JetBrains Mono';
    ctx.textAlign = 'right';
    ctx.fillText(maxV.toFixed(3), pad.left - 3, pad.top + 5);
    ctx.fillText(minV.toFixed(3), pad.left - 3, h - pad.bottom);
    ctx.fillText('1.0', pad.left - 3, v10Y + 3);

    ctx.textAlign = 'center';
    ctx.fillText('バス番号', w / 2, h - 3);

    // Legend
    document.getElementById('voltageLegend').innerHTML = selectedAlgos
        .filter(a => voltageData[a])
        .map(a => `<div class="legend-item"><span class="legend-dot" style="background:${ALGOS[a].color}"></span>${ALGOS[a].short}</div>`)
        .join('');
}

/**
 * Draw angle comparison (AC vs DC)
 */
function drawAngleCompare() {
    const canvas = document.getElementById('angleCanvas');
    const ctx = canvas.getContext('2d');
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width - 8;
    canvas.height = rect.height - 8;

    const w = canvas.width, h = canvas.height;
    const pad = { top: 15, right: 50, bottom: 20, left: 35 };

    ctx.fillStyle = '#12121a';
    ctx.fillRect(0, 0, w, h);

    const acAlgo = ['nr', 'fdxb', 'fdbx', 'lm'].find(a => engines[a] && engines[a].converged);
    const dcE = engines['dc'];

    if (!acAlgo || !dcE) {
        ctx.fillStyle = '#64748b';
        ctx.font = '10px JetBrains Mono';
        ctx.textAlign = 'center';
        ctx.fillText('AC解とDC解が必要', w / 2, h / 2);
        return;
    }

    const acE = engines[acAlgo];
    const nBus = acE.nBus;
    const deltaAC = acE.delta.map(d => d * 180 / Math.PI);
    const deltaDC = dcE.delta.map(d => d * 180 / Math.PI);

    const minD = Math.min(...deltaAC, ...deltaDC, 0) - 2;
    const maxD = Math.max(...deltaAC, ...deltaDC, 0) + 2;
    const range = maxD - minD || 1;

    const pW = w - pad.left - pad.right;
    const pH = h - pad.top - pad.bottom;

    // Zero line
    const zeroY = pad.top + maxD / range * pH;
    ctx.strokeStyle = '#64748b';
    ctx.setLineDash([2, 2]);
    ctx.beginPath();
    ctx.moveTo(pad.left, zeroY);
    ctx.lineTo(w - pad.right, zeroY);
    ctx.stroke();
    ctx.setLineDash([]);

    // AC line
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < nBus; i++) {
        const x = pad.left + (i + 0.5) / nBus * pW;
        const y = pad.top + (maxD - deltaAC[i]) / range * pH;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // DC line
    ctx.strokeStyle = '#8b5cf6';
    ctx.beginPath();
    for (let i = 0; i < nBus; i++) {
        const x = pad.left + (i + 0.5) / nBus * pW;
        const y = pad.top + (maxD - deltaDC[i]) / range * pH;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // Legend
    ctx.fillStyle = '#3b82f6';
    ctx.fillRect(w - 45, 5, 12, 3);
    ctx.fillStyle = '#8b5cf6';
    ctx.fillRect(w - 45, 12, 12, 3);
    ctx.fillStyle = '#f1f5f9';
    ctx.font = '8px JetBrains Mono';
    ctx.textAlign = 'left';
    ctx.fillText('AC', w - 30, 9);
    ctx.fillText('DC', w - 30, 16);
}

/**
 * Draw voltage error comparison
 */
function drawVoltageError() {
    const canvas = document.getElementById('voltageErrorCanvas');
    const ctx = canvas.getContext('2d');
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width - 8;
    canvas.height = rect.height - 8;

    const w = canvas.width, h = canvas.height;
    const pad = { top: 20, right: 50, bottom: 20, left: 40 };

    ctx.fillStyle = '#12121a';
    ctx.fillRect(0, 0, w, h);

    const refAlgo = ['nr', 'fdxb', 'fdbx', 'lm'].find(a => engines[a] && engines[a].converged);

    if (!refAlgo) {
        ctx.fillStyle = '#64748b';
        ctx.font = '10px JetBrains Mono';
        ctx.textAlign = 'center';
        ctx.fillText('基準AC解が必要', w / 2, h / 2);
        return;
    }

    const refV = engines[refAlgo].V;
    const nBus = engines[refAlgo].nBus;

    // Calculate errors
    const errorData = {};
    let maxErr = 0;

    for (const algo of selectedAlgos) {
        if (algo === refAlgo) continue;
        const e = engines[algo];
        if (!e || (!e.converged && e.iteration === 0)) continue;

        const errors = [];
        for (let i = 0; i < nBus; i++) {
            const err = (e.V[i] - refV[i]) * 100;
            errors.push(err);
            maxErr = Math.max(maxErr, Math.abs(err));
        }
        errorData[algo] = errors;
    }

    if (Object.keys(errorData).length === 0) {
        ctx.fillStyle = '#64748b';
        ctx.font = '10px JetBrains Mono';
        ctx.textAlign = 'center';
        ctx.fillText('他の手法を実行', w / 2, h / 2);
        return;
    }

    maxErr = Math.max(maxErr, 0.5);
    const pW = w - pad.left - pad.right;
    const pH = h - pad.top - pad.bottom;

    // Zero line
    const zeroY = pad.top + pH / 2;
    ctx.strokeStyle = 'rgba(100,116,139,0.5)';
    ctx.setLineDash([2, 2]);
    ctx.beginPath();
    ctx.moveTo(pad.left, zeroY);
    ctx.lineTo(w - pad.right, zeroY);
    ctx.stroke();
    ctx.setLineDash([]);

    // Draw error lines
    for (const algo in errorData) {
        const errors = errorData[algo];
        ctx.strokeStyle = ALGOS[algo].color;
        ctx.lineWidth = algo === 'gs' ? 2.5 : 1.5;
        ctx.beginPath();

        for (let i = 0; i < nBus; i++) {
            const x = pad.left + (i + 0.5) / nBus * pW;
            const y = zeroY - (errors[i] / maxErr) * (pH / 2);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    // Stats
    let statsText = `基準: ${ALGOS[refAlgo].short}`;
    for (const algo in errorData) {
        const errors = errorData[algo];
        const avgErr = errors.reduce((a, b) => a + Math.abs(b), 0) / errors.length;
        const maxAbsErr = Math.max(...errors.map(e => Math.abs(e)));
        statsText += ` | ${ALGOS[algo].short}: avg ${avgErr.toFixed(3)}%, max ${maxAbsErr.toFixed(3)}%`;
    }

    ctx.fillStyle = '#f1f5f9';
    ctx.font = '8px JetBrains Mono';
    ctx.textAlign = 'center';
    ctx.fillText(statsText, w / 2, pad.top - 5);

    // Y axis
    ctx.fillStyle = '#94a3b8';
    ctx.textAlign = 'right';
    ctx.fillText(`+${maxErr.toFixed(1)}%`, pad.left - 3, pad.top + 5);
    ctx.fillText('0%', pad.left - 3, zeroY + 3);
    ctx.fillText(`-${maxErr.toFixed(1)}%`, pad.left - 3, h - pad.bottom);
}

/**
 * Draw reactive power distribution
 */
function drawQDistribution() {
    const canvas = document.getElementById('qDistCanvas');
    const ctx = canvas.getContext('2d');
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width - 8;
    canvas.height = rect.height - 8;

    const w = canvas.width, h = canvas.height;
    const pad = { top: 15, right: 10, bottom: 20, left: 40 };

    ctx.fillStyle = '#12121a';
    ctx.fillRect(0, 0, w, h);

    const acAlgo = ['nr', 'fdxb', 'fdbx', 'lm'].find(a => engines[a] && engines[a].converged);

    if (!acAlgo) {
        ctx.fillStyle = '#64748b';
        ctx.font = '10px JetBrains Mono';
        ctx.textAlign = 'center';
        ctx.fillText('AC解が必要', w / 2, h / 2);
        return;
    }

    const e = engines[acAlgo];
    const power = e.calcPower();
    const Q = power.Q.map(q => q * e.baseMVA);
    const nBus = e.nBus;

    const minQ = Math.min(...Q, -10);
    const maxQ = Math.max(...Q, 10);
    const range = maxQ - minQ || 1;

    const pW = w - pad.left - pad.right;
    const pH = h - pad.top - pad.bottom;

    // Zero line
    const zeroY = pad.top + (maxQ / range) * pH;
    ctx.strokeStyle = '#64748b';
    ctx.setLineDash([2, 2]);
    ctx.beginPath();
    ctx.moveTo(pad.left, zeroY);
    ctx.lineTo(w - pad.right, zeroY);
    ctx.stroke();
    ctx.setLineDash([]);

    // Bars
    const barW = Math.max(pW / nBus - 1, 1);
    for (let i = 0; i < nBus; i++) {
        const x = pad.left + i * (barW + 1);
        const barH = Math.abs(Q[i]) / range * pH;
        const y = Q[i] >= 0 ? zeroY - barH : zeroY;
        ctx.fillStyle = Q[i] >= 0 ? '#ec4899' : '#06b6d4';
        ctx.fillRect(x, y, barW, barH);
    }

    ctx.fillStyle = '#94a3b8';
    ctx.font = '8px JetBrains Mono';
    ctx.textAlign = 'right';
    ctx.fillText(`${maxQ.toFixed(0)}`, pad.left - 3, pad.top + 5);
    ctx.fillText(`${minQ.toFixed(0)}`, pad.left - 3, h - pad.bottom);
}

/**
 * Draw DC accuracy vs Q/P ratio scatter plot
 */
function drawDCAccuracy() {
    const canvas = document.getElementById('dcAccuracyCanvas');
    const ctx = canvas.getContext('2d');
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width - 8;
    canvas.height = rect.height - 8;

    const w = canvas.width, h = canvas.height;
    const pad = { top: 15, right: 10, bottom: 25, left: 40 };

    ctx.fillStyle = '#12121a';
    ctx.fillRect(0, 0, w, h);

    const acAlgo = ['nr', 'fdxb', 'fdbx', 'lm'].find(a => engines[a] && engines[a].converged);
    const dcE = engines['dc'];

    if (!acAlgo || !dcE) {
        ctx.fillStyle = '#64748b';
        ctx.font = '10px JetBrains Mono';
        ctx.textAlign = 'center';
        ctx.fillText('AC解とDC解が必要', w / 2, h / 2);
        return;
    }

    const acE = engines[acAlgo];
    const nBus = acE.nBus;
    const pW = w - pad.left - pad.right;
    const pH = h - pad.top - pad.bottom;

    // Calculate Q/P ratio and angle error per bus
    const data = [];
    for (let i = 0; i < nBus; i++) {
        const Pd = acE.busData[i][2];
        const Qd = acE.busData[i][3];
        const qpRatio = Pd > 0 ? Math.abs(Qd / Pd) : 0;
        const deltaErr = Math.abs(dcE.delta[i] - acE.delta[i]) * 180 / Math.PI;
        data.push({ qpRatio, deltaErr });
    }

    const maxQP = Math.max(...data.map(d => d.qpRatio), 1);
    const maxErr = Math.max(...data.map(d => d.deltaErr), 1);

    // Draw points
    data.forEach(d => {
        const x = pad.left + (d.qpRatio / maxQP) * pW;
        const y = pad.top + pH - (d.deltaErr / maxErr) * pH;
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, 2 * Math.PI);
        ctx.fillStyle = d.deltaErr > 3 ? '#ef4444' : d.deltaErr > 1 ? '#f59e0b' : '#10b981';
        ctx.fill();
    });

    ctx.fillStyle = '#94a3b8';
    ctx.font = '8px JetBrains Mono';
    ctx.textAlign = 'center';
    ctx.fillText('Q/P比', w / 2, h - 3);
    ctx.textAlign = 'right';
    ctx.fillText(maxErr.toFixed(1) + '°', pad.left - 3, pad.top + 5);
    ctx.fillText('0°', pad.left - 3, h - pad.bottom);
}

// Initialize on DOM ready
document.addEventListener('DOMContentLoaded', init);
