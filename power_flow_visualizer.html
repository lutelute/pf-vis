<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>潮流計算アルゴリズム可視化</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e14;
            --bg-secondary: #131920;
            --bg-tertiary: #1a2129;
            --accent-cyan: #00d4ff;
            --accent-green: #00ff88;
            --accent-orange: #ff9500;
            --accent-red: #ff4757;
            --accent-purple: #a855f7;
            --accent-yellow: #ffd700;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --grid-color: rgba(0, 212, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans JP', 'JetBrains Mono', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Navigation Bar */
        .nav-bar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-primary);
        }

        .nav-logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .nav-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-link:hover {
            background: var(--bg-tertiary);
            color: var(--accent-cyan);
        }

        .nav-link.primary {
            background: var(--accent-cyan);
            color: var(--bg-primary);
            font-weight: 500;
        }

        .nav-link.primary:hover {
            background: var(--accent-green);
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .control-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-group input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: var(--bg-tertiary);
            border-radius: 3px;
            outline: none;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--accent-cyan);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        .control-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2rem;
            color: var(--accent-cyan);
            font-weight: 600;
        }

        .btn {
            font-family: 'JetBrains Mono', monospace;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-green));
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--accent-cyan);
        }

        .algorithm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .algorithm-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .algorithm-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--card-accent, var(--accent-cyan));
        }

        .algorithm-card:hover {
            border-color: var(--card-accent, var(--accent-cyan));
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .algorithm-card.running {
            border-color: var(--accent-yellow);
            animation: pulse 1s infinite;
        }

        .algorithm-card.completed {
            border-color: var(--accent-green);
        }

        .algorithm-card.failed {
            border-color: var(--accent-red);
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.4); }
            50% { box-shadow: 0 0 20px 5px rgba(255, 215, 0, 0.2); }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .algorithm-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .algorithm-category {
            font-size: 0.7rem;
            padding: 3px 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            color: var(--card-accent, var(--accent-cyan));
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .convergence-chart {
            width: 100%;
            height: 120px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }

        .convergence-chart canvas {
            width: 100%;
            height: 100%;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .stat-item {
            text-align: center;
            padding: 8px;
            background: var(--bg-tertiary);
            border-radius: 6px;
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent-cyan);
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .formula-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .formula-section h2 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--accent-cyan);
        }

        .formula-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 15px;
        }

        .formula-card {
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 15px;
            border-left: 3px solid var(--accent-purple);
        }

        .formula-title {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            font-family: 'JetBrains Mono', monospace;
        }

        .formula-content {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--text-primary);
            line-height: 1.8;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        .formula-content .math {
            color: var(--accent-green);
        }

        .formula-content .variable {
            color: var(--accent-orange);
        }

        .comparison-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .comparison-section h2 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--accent-cyan);
        }

        .chart-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .chart-box {
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 20px;
            height: 300px;
        }

        .chart-box h3 {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
            font-family: 'JetBrains Mono', monospace;
        }

        .chart-box canvas {
            width: 100%;
            height: calc(100% - 30px);
        }

        .network-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .network-section h2 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--accent-cyan);
        }

        #network-canvas {
            width: 100%;
            height: 400px;
            background: var(--bg-tertiary);
            border-radius: 8px;
        }

        .results-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            overflow-x: auto;
        }

        .results-section h2 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--accent-cyan);
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }

        .results-table th,
        .results-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .results-table th {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .results-table tr:hover {
            background: var(--bg-tertiary);
        }

        .rank-badge {
            display: inline-block;
            width: 24px;
            height: 24px;
            line-height: 24px;
            text-align: center;
            border-radius: 50%;
            font-weight: 600;
            font-size: 0.75rem;
        }

        .rank-1 { background: var(--accent-yellow); color: var(--bg-primary); }
        .rank-2 { background: #c0c0c0; color: var(--bg-primary); }
        .rank-3 { background: #cd7f32; color: var(--bg-primary); }

        .status-badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        .status-converged { background: rgba(0, 255, 136, 0.2); color: var(--accent-green); }
        .status-diverged { background: rgba(255, 71, 87, 0.2); color: var(--accent-red); }
        .status-running { background: rgba(255, 215, 0, 0.2); color: var(--accent-yellow); }

        .progress-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        .tab-nav {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 6px 6px 0 0;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        .tab-btn.active {
            color: var(--accent-cyan);
            background: var(--bg-tertiary);
            border-bottom: 2px solid var(--accent-cyan);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .speed-btn {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
        }

        .speed-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .speed-btn.active {
            background: var(--accent-cyan);
            color: var(--bg-primary);
            border-color: var(--accent-cyan);
        }

        @media (max-width: 768px) {
            .chart-container {
                grid-template-columns: 1fr;
            }
            .algorithm-grid {
                grid-template-columns: 1fr;
            }
            .formula-grid {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- Shared Power Flow Modules -->
    <script src="scripts/ieee_cases.js"></script>
    <script src="scripts/power_flow_engine.js"></script>
    <!-- Navigation Bar -->
    <nav class="nav-bar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <div class="nav-logo-icon">⚡</div>
                <span class="nav-title">Power Flow Visualization</span>
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link primary">🏠 ダッシュボード</a>
                <a href="https://github.com/lutelute/power_flow_viz" class="nav-link" target="_blank">📁 GitHub</a>
            </div>
        </div>
    </nav>
    <div class="container">
        <header>
            <h1>⚡ 潮流計算アルゴリズム可視化</h1>
            <p class="subtitle">Power Flow Algorithm Visualizer - 20 Methods Comparison</p>
        </header>

        <div class="control-panel">
            <div class="control-group">
                <label>ノード数 (Buses)</label>
                <input type="range" id="nodeCount" min="3" max="30" value="9">
                <span class="control-value" id="nodeCountValue">9</span>
            </div>
            <div class="control-group">
                <label>ブランチ数 (Branches)</label>
                <input type="range" id="branchCount" min="2" max="50" value="12">
                <span class="control-value" id="branchCountValue">12</span>
            </div>
            <div class="control-group">
                <label>収束判定 (Tolerance)</label>
                <input type="range" id="tolerance" min="-8" max="-2" value="-6">
                <span class="control-value" id="toleranceValue">10⁻⁶</span>
            </div>
            <div class="control-group">
                <label>最大反復回数</label>
                <input type="range" id="maxIterations" min="10" max="500" value="100">
                <span class="control-value" id="maxIterationsValue">100</span>
            </div>
            <div class="control-group">
                <label>アニメーション速度</label>
                <div class="speed-control">
                    <button class="speed-btn" data-speed="0.5">0.5x</button>
                    <button class="speed-btn active" data-speed="1">1x</button>
                    <button class="speed-btn" data-speed="2">2x</button>
                    <button class="speed-btn" data-speed="5">5x</button>
                </div>
            </div>
            <div class="control-group" style="justify-content: flex-end;">
                <button class="btn btn-primary" id="runAll">▶ 全アルゴリズム実行</button>
                <button class="btn btn-secondary" id="reset">↺ リセット</button>
            </div>
        </div>

        <div class="progress-container" id="progressContainer" style="display: none;">
            <div class="progress-text">
                <span id="progressText">実行中...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
            </div>
        </div>

        <div class="tab-nav">
            <button class="tab-btn active" data-tab="algorithms">アルゴリズム比較</button>
            <button class="tab-btn" data-tab="formulas">数式</button>
            <button class="tab-btn" data-tab="network">系統図</button>
            <button class="tab-btn" data-tab="results">結果一覧</button>
        </div>

        <div class="tab-content active" id="tab-algorithms">
            <div class="algorithm-grid" id="algorithmGrid"></div>
            <div class="comparison-section">
                <h2>📊 比較チャート</h2>
                <div class="chart-container">
                    <div class="chart-box">
                        <h3>反復回数 vs 精度</h3>
                        <canvas id="iterationChart"></canvas>
                    </div>
                    <div class="chart-box">
                        <h3>計算時間比較</h3>
                        <canvas id="timeChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-content" id="tab-formulas">
            <div class="formula-section">
                <h2>📐 潮流計算の基本方程式</h2>
                <div class="formula-grid" id="formulaGrid"></div>
            </div>
        </div>

        <div class="tab-content" id="tab-network">
            <div class="network-section">
                <h2>🔌 電力系統図</h2>
                <canvas id="network-canvas"></canvas>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: var(--accent-green);"></div>
                        <span>Slack Bus</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: var(--accent-orange);"></div>
                        <span>PV Bus (Generator)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: var(--accent-cyan);"></div>
                        <span>PQ Bus (Load)</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-content" id="tab-results">
            <div class="results-section">
                <h2>📋 アルゴリズム性能比較</h2>
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>順位</th>
                            <th>アルゴリズム</th>
                            <th>カテゴリ</th>
                            <th>反復回数</th>
                            <th>最終誤差</th>
                            <th>計算時間</th>
                            <th>状態</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const algorithms = [
            { id: 'gauss-seidel', name: 'Gauss-Seidel法', category: '反復法', color: '#00d4ff' },
            { id: 'newton-raphson-polar', name: 'Newton-Raphson法 (極座標)', category: 'Newton系', color: '#00ff88' },
            { id: 'newton-raphson-rect', name: 'Newton-Raphson法 (直交座標)', category: 'Newton系', color: '#22c55e' },
            { id: 'fast-decoupled-xb', name: 'Fast Decoupled法 (XB)', category: '簡略化Newton', color: '#ff9500' },
            { id: 'fast-decoupled-bx', name: 'Fast Decoupled法 (BX)', category: '簡略化Newton', color: '#f97316' },

                                  '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻'};
            return String(num).split('').map(c => superscripts[c] || c).join('');
        }

        /**
         * Generate Network Data
         *
         * @description Creates random power system network data in both visualization
         * format and MATPOWER-compatible format for use with PowerFlowEngine.
         *
         * Follows MATPOWER v2 data format conventions:
         * - Bus types: 1=PQ, 2=PV, 3=Slack
         * - All values in per-unit on 100 MVA base
         */
        function generateNetwork() {
            const n = state.nodeCount;
            const m = state.branchCount;
            const baseMVA = 100;

            // Generate visualization nodes
            const nodes = [];
            // Generate MATPOWER bus data
            const busData = [];
            const genData = [];

            for (let i = 0; i < n; i++) {
                let type = 'PQ';
                let busType = 1;  // PQ bus

                if (i === 0) {
                    type = 'Slack';
                    busType = 3;  // Slack bus
                } else if (i < Math.ceil(n * 0.3)) {
                    type = 'PV';
                    busType = 2;  // PV bus
                }

                // Generate load power (MW for MATPOWER, p.u. for visualization)
                const Pload = (type === 'PQ') ? (Math.random() * 30 + 10) : 0;  // 10-40 MW
                const Qload = (type === 'PQ') ? (Math.random() * 15 + 5) : 0;   // 5-20 MVAr

                nodes.push({
                    id: i,
                    type: type,
                    voltage: 1.0,
                    angle: 0,
                    P: type === 'Slack' ? 0 : (type === 'PV' ? (Math.random() * 50 + 20) / baseMVA : -Pload / baseMVA),
                    Q: type === 'PQ' ? -Qload / baseMVA : 0
                });

                // MATPOWER bus data: [BUS_I, TYPE, PD, QD, GS, BS, AREA, VM, VA, BASE_KV, ZONE, VMAX, VMIN]
                busData.push([
                    i + 1,      // BUS_I (1-indexed)
                    busType,    // BUS_TYPE
                    Pload,      // PD (MW)
                    Qload,      // QD (MVAr)
                    0,          // GS
                    0,          // BS
                    1,          // AREA
                    1.0,        // VM (p.u.)
                    0,          // VA (degrees)
                    230,        // BASE_KV
                    1,          // ZONE
                    1.1,        // VMAX
                    0.9         // VMIN
                ]);

                // Add generator data for Slack and PV buses
                if (type === 'Slack' || type === 'PV') {
                    const Pgen = (type === 'Slack') ? 0 : (Math.random() * 50 + 20);  // Slack adjusts automatically
                    const Vsetpoint = 1.0 + (Math.random() * 0.04 - 0.02);  // 0.98-1.02 p.u.

                    // MATPOWER gen data: [GEN_BUS, PG, QG, QMAX, QMIN, VG, MBASE, STATUS, PMAX, PMIN]
                    genData.push([
                        i + 1,      // GEN_BUS (1-indexed)
                        Pgen,       // PG (MW)
                        0,          // QG (MVAr)
                        100,        // QMAX
                        -100,       // QMIN
                        Vsetpoint,  // VG (p.u.)
                        baseMVA,    // MBASE
                        1,          // STATUS
                        200,        // PMAX
                        0           // PMIN
                    ]);
                }
            }

            // Generate visualization branches
            const branches = [];
            const branchData = [];
            const connected = new Set([0]);

            // Ensure connectivity - create spanning tree first
            for (let i = 1; i < n; i++) {
                const from = Array.from(connected)[Math.floor(Math.random() * connected.size)];
                const r = Math.random() * 0.05 + 0.01;
                const x = Math.random() * 0.1 + 0.05;
                const b = Math.random() * 0.02;

                branches.push({ from, to: i, r, x, b });

                // MATPOWER branch data: [F_BUS, T_BUS, R, X, B, RATE_A, RATE_B, RATE_C, TAP, SHIFT, STATUS]
                branchData.push([
                    from + 1,   // F_BUS (1-indexed)
                    i + 1,      // T_BUS (1-indexed)
                    r,          // BR_R
                    x,          // BR_X
                    b,          // BR_B
                    250,        // RATE_A
                    250,        // RATE_B
                    250,        // RATE_C
                    0,          // TAP (0 = line)
                    0,          // SHIFT
                    1           // STATUS
                ]);

                connected.add(i);
            }

            // Add additional branches up to requested count
            while (branches.length < m && branches.length < n * (n-1) / 2) {
                const from = Math.floor(Math.random() * n);
                const to = Math.floor(Math.random() * n);
                if (from !== to && !branches.some(branch =>
                    (branch.from === from && branch.to === to) ||
                    (branch.from === to && branch.to === from))) {

                    const r = Math.random() * 0.05 + 0.01;
                    const x = Math.random() * 0.1 + 0.05;
                    const b = Math.random() * 0.02;

                    branches.push({ from, to, r, x, b });

                    branchData.push([
                        from + 1, to + 1, r, x, b,
                        250, 250, 250, 0, 0, 1
                    ]);
                }
            }

            // Store visualization network
            state.network = { nodes, branches };

            // Store MATPOWER-format case data for PowerFlowEngine
            state.caseData = {
                name: `Random ${n}-Bus System`,
                baseMVA: baseMVA,
                bus: busData,
                gen: genData,
                branch: branchData
            };
        }

        function drawNetworkCanvas() {
            const canvas = document.getElementById('network-canvas');
            const ctx = canvas.getContext('2d');
            const rect = canvas.parentElement.getBoundingClientRect();
            
            canvas.width = rect.width - 50;
            canvas.height = 400;

            const width = canvas.width;
            const height = canvas.height;

            ctx.fillStyle = '#1a2129';
            ctx.fillRect(0, 0, width, height);

            if (!state.network) return;

            const { nodes, branches } = state.network;
            const n = nodes.length;

            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(width, height) * 0.35;

            const positions = nodes.map((node, i) => ({
                x: centerX + radius * Math.cos(2 * Math.PI * i / n - Math.PI / 2),
                y: centerY + radius * Math.sin(2 * Math.PI * i / n - Math.PI / 2)
            }));

            branches.forEach(branch => {
                const from = positions[branch.from];
                const to = positions[branch.to];

                ctx.beginPath();
                ctx.moveTo(from.x, from.y);
                ctx.lineTo(to.x, to.y);
                ctx.strokeStyle = 'rgba(0, 212, 255, 0.4)';
                ctx.lineWidth = 2;
                ctx.stroke();

                const midX = (from.x + to.x) / 2;
                const midY = (from.y + to.y) / 2;
                ctx.fillStyle = '#8b949e';
                ctx.font = '10px JetBrains Mono';
                ctx.textAlign = 'center';
                ctx.fillText(`${branch.r.toFixed(3)}+j${branch.x.toFixed(3)}`, midX, midY - 5);
            });

            nodes.forEach((node, i) => {
                const pos = positions[i];
                const nodeRadius = 25;

                ctx.beginPath();
                ctx.arc(pos.x, pos.y, nodeRadius, 0, 2 * Math.PI);
                
                let fillColor;
                if (node.type === 'Slack') fillColor = '#00ff88';
                else if (node.type === 'PV') fillColor = '#ff9500';
                else fillColor = '#00d4ff';

                ctx.fillStyle = fillColor;
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#0a0e14';
                ctx.font = 'bold 12px JetBrains Mono';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`${i + 1}`, pos.x, pos.y);

                ctx.fillStyle = '#e6edf3';
                ctx.font = '10px JetBrains Mono';
                ctx.fillText(node.type, pos.x, pos.y + nodeRadius + 15);
            });

            ctx.fillStyle = '#8b949e';
            ctx.font = '12px JetBrains Mono';
            ctx.textAlign = 'left';
            ctx.fillText(`Nodes: ${n}  |  Branches: ${branches.length}`, 10, 20);
        }

        /**
         * Simulate Power Flow for Unsupported Algorithms
         *
         * @description Simulates power flow convergence behavior for algorithms
         * not yet implemented in PowerFlowEngine. Uses characteristic-based
         * simulation to demonstrate typical convergence patterns.
         *
         * @param {Object} algorithm - Algorithm configuration object
         * @returns {Promise<Object>} Simulated convergence results
         */
        function simulatePowerFlow(algorithm) {
            return new Promise((resolve) => {
                const history = [];
                let iterations = 0;
                let error = 1;
                const startTime = performance.now();

                const characteristics = getAlgorithmCharacteristics(algorithm);
                const baseConvergence = characteristics.convergenceRate;
                const complexity = characteristics.complexity;

                const simulate = () => {
                    if (iterations >= state.maxIterations || error < state.tolerance) {
                        const endTime = performance.now();
                        const converged = error < state.tolerance;
                        
                        resolve({
                            algorithm: algorithm.id,
                            iterations: iterations,
                            finalError: error,
                            time: (endTime - startTime) * complexity,
                            converged: converged,
                            history: history
                        });
                        return;
                    }

                    const noise = (Math.random() - 0.5) * 0.3;
                    const networkFactor = 1 + (state.nodeCount - 5) * 0.02 + (state.branchCount - 10) * 0.01;
                    
                    if (algorithm.id === 'dc-power-flow') {
                        error = state.tolerance * 0.1;
                        iterations = 1;
                    } else {
                        error = error * Math.pow(baseConvergence, 1 + noise) * networkFactor;
                        
                        if (Math.random() < characteristics.divergenceRisk * networkFactor * 0.1) {
                            error = error * 1.5;
                        }
                    }

                    history.push({ iteration: iterations, error: Math.max(error, 1e-16) });
                    iterations++;

                    setTimeout(simulate, 50 / state.animationSpeed);
                };

                simulate();
            });
        }

        /**
         * Get Algorithm Characteristics for Simulation
         *
         * @description Returns convergence characteristics for simulating
         * algorithms not yet implemented in PowerFlowEngine.
         *
         * @param {Object} algo - Algorithm configuration object
         * @returns {Object} Characteristics with convergenceRate, complexity, divergenceRisk
         */
        function getAlgorithmCharacteristics(algo) {
            const chars = {
                'gauss-seidel': { convergenceRate: 0.7, complexity: 1, divergenceRisk: 0.1 },
                'newton-raphson-polar': { convergenceRate: 0.1, complexity: 1.5, divergenceRisk: 0.05 },
                'newton-raphson-rect': { convergenceRate: 0.12, complexity: 1.5, divergenceRisk: 0.04 },
                'fast-decoupled-xb': { convergenceRate: 0.25, complexity: 0.8, divergenceRisk: 0.08 },
                'fast-decoupled-bx': { convergenceRate: 0.28, complexity: 0.8, divergenceRisk: 0.08 },
                'dc-power-flow': { convergenceRate: 0.01, complexity: 0.3, divergenceRisk: 0 },
                'gauss': { convergenceRate: 0.8, complexity: 0.9, divergenceRisk: 0.15 },
                'z-bus-gauss': { convergenceRate: 0.65, complexity: 1.2, divergenceRisk: 0.12 },
                'levenberg-marquardt': { convergenceRate: 0.15, complexity: 2, divergenceRisk: 0.02 },
                'iwamoto': { convergenceRate: 0.08, complexity: 1.8, divergenceRisk: 0.03 },
                'continuation': { convergenceRate: 0.2, complexity: 2.5, divergenceRisk: 0.02 },
                'holomorphic': { convergenceRate: 0.05, complexity: 3, divergenceRisk: 0.01 },
                'backward-forward': { convergenceRate: 0.3, complexity: 0.5, divergenceRisk: 0.2 },
                'quasi-newton': { convergenceRate: 0.18, complexity: 1.3, divergenceRisk: 0.06 },
                'jacobi': { convergenceRate: 0.85, complexity: 0.8, divergenceRisk: 0.2 },
                'sor': { convergenceRate: 0.5, complexity: 0.9, divergenceRisk: 0.12 },
                'current-injection': { convergenceRate: 0.12, complexity: 1.4, divergenceRisk: 0.05 },
                'implicit-zbus': { convergenceRate: 0.6, complexity: 1.1, divergenceRisk: 0.1 },
                'modified-gs': { convergenceRate: 0.55, complexity: 1, divergenceRisk: 0.08 },
                'second-order-nr': { convergenceRate: 0.05, complexity: 2.5, divergenceRisk: 0.04 }
            };
            return chars[algo.id] || { convergenceRate: 0.5, complexity: 1, divergenceRisk: 0.1 };
        }

        async function runAllAlgorithms() {
            if (state.running) return;
            state.running = true;
            state.results = {};

            const runBtn = document.getElementById('runAll');
            runBtn.disabled = true;
            runBtn.textContent = '実行中...';

            const progressContainer = document.getElementById('progressContainer');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const progressPercent = document.getElementById('progressPercent');
            progressContainer.style.display = 'block';

            algorithms.forEach(algo => {
                const card = document.getElementById(`card-${algo.id}`);
                card.className = 'algorithm-card';
                document.getElementById(`iter-${algo.id}`).textContent = '-';
                document.getElementById(`error-${algo.id}`).textContent = '-';
                document.getElementById(`time-${algo.id}`).textContent = '-';
                clearCanvas(`chart-${algo.id}`);
            });

            const totalAlgorithms = algorithms.length;
            let completed = 0;

            for (const algo of algorithms) {
                const card = document.getElementById(`card-${algo.id}`);
                card.classList.add('running');
                progressText.textContent = `実行中: ${algo.name}`;

                const result = await runSingleAlgorithm(algo);
                state.results[algo.id] = result;

                card.classList.remove('running');
                if (!result) {
                    // 実装なし: 数式解説のみのカタログ項目
                    document.getElementById(`iter-${algo.id}`).textContent = '—';
                    document.getElementById(`error-${algo.id}`).textContent = '解説のみ';
                    document.getElementById(`time-${algo.id}`).textContent = '—';
                    completed++;
                    const pct = Math.round((completed / totalAlgorithms) * 100);
                    progressFill.style.width = `${pct}%`;
                    progressPercent.textContent = `${pct}%`;
                    continue;
                }
                card.classList.add(result.converged ? 'completed' : 'failed');

                document.getElementById(`iter-${algo.id}`).textContent = result.iterations;
                document.getElementById(`error-${algo.id}`).textContent = result.finalError.toExponential(2);
                document.getElementById(`time-${algo.id}`).textContent = result.time.toFixed(1);

                drawConvergenceChart(`chart-${algo.id}`, result.history, algo.color);

                completed++;
                const percent = Math.round((completed / totalAlgorithms) * 100);
                progressFill.style.width = `${percent}%`;
                progressPercent.textContent = `${percent}%`;
            }

            progressText.textContent = '完了!';
            
            updateComparisonCharts();
            updateResultsTable();

            setTimeout(() => {
                progressContainer.style.display = 'none';
                runBtn.disabled = false;
                runBtn.textContent = '▶ 全アルゴリズム実行';
                state.running = false;
            }, 1000);
        }

        /**
         * Run a Single Algorithm
         *
         * @description Runs power flow for a single algorithm. Uses PowerFlowEngine
         * for implemented algorithms (NR, GS, FDXB, DC) and simulation for others.
         *
         * @param {Object} algo - Algorithm configuration object
         * @returns {Promise<Object>} Algorithm results with convergence data
         */
        async function runSingleAlgorithm(algo) {
            // Check if this algorithm is implemented in PowerFlowEngine
            const engineAlgorithm = ENGINE_ALGORITHMS[algo.id];

            if (engineAlgorithm && state.caseData) {
                // Use PowerFlowEngine for implemented algorithms
                return await runWithEngine(algo, engineAlgorithm);
            }
            // それ以外の手法は本ツールでは実行しない（数式解説のみ）。
            // 以前は特性パラメータによる疑似曲線を表示していたが、
            // 実測と誤解されるため廃止した。
            return null;
        }

        /**
         * Run Power Flow Using PowerFlowEngine
         *
         * @description Executes power flow using the standardized PowerFlowEngine
         * with proper algorithm invocation patterns.
         *
         * @param {Object} algo - Algorithm configuration object
         * @param {string} engineAlgorithm - Engine algorithm code ('nr', 'gs', 'fdxb', 'dc')
         * @returns {Promise<Object>} Power flow results
         */
        async function runWithEngine(algo, engineAlgorithm) {
            return new Promise((resolve) => {
                const startTime = performance.now();
                const history = [];

                try {
                    // Create fresh engine instance with current case data
                    const engine = new PowerFlowEngine(state.caseData);

                    // Solve using standardized interface with options object
                    const result = engine.solve({
                        algorithm: engineAlgorithm,
                        tolerance: state.tolerance,
                        maxIterations: state.maxIterations
                    });

                    const endTime = performance.now();

                    // Convert engine error history to visualization format
                    result.errorHistory.forEach(entry => {
                        history.push({
                            iteration: entry.iteration,
                            error: Math.max(entry.max, 1e-16)
                        });
                    });

                    // If no history recorded (e.g., DC power flow), create single entry
                    if (history.length === 0) {
                        history.push({ iteration: 1, error: state.tolerance * 0.1 });
                    }

                    resolve({
                        algorithm: algo.id,
                        iterations: result.iterations,
                        finalError: result.maxError || state.tolerance * 0.1,
                        time: endTime - startTime,
                        converged: result.converged,
                        history: history,
                        usingEngine: true
                    });
                } catch (error) {
                    // Engine failed - return diverged result
                    const endTime = performance.now();
                    history.push({ iteration: 1, error: 1 });

                    resolve({
                        algorithm: algo.id,
                        iterations: 1,
                        finalError: 1,
                        time: endTime - startTime,
                        converged: false,
                        history: history,
                        usingEngine: true,
                        error: error.message
                    });
                }
            });
        }

        function clearCanvas(canvasId) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.fillStyle = '#1a2129';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawConvergenceChart(canvasId, history, color) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            const width = canvas.width;
            const height = canvas.height;
            const padding = { top: 10, right: 10, bottom: 20, left: 40 };

            ctx.fillStyle = '#1a2129';
            ctx.fillRect(0, 0, width, height);

            if (history.length === 0) return;

            const maxIter = Math.max(...history.map(h => h.iteration));
            const errors = history.map(h => h.error);
            const minError = Math.min(...errors);
            const maxError = Math.max(...errors);
            
            const logMin = Math.log10(Math.max(minError, 1e-16));
            const logMax = Math.log10(maxError);

            const xScale = (width - padding.left - padding.right) / Math.max(maxIter, 1);
            const yScale = (height - padding.top - padding.bottom) / (logMax - logMin || 1);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= 4; i++) {
                const y = padding.top + i * (height - padding.top - padding.bottom) / 4;
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(width - padding.right, y);
                ctx.stroke();
            }

            const tolY = padding.top + (logMax - Math.log10(state.tolerance)) * yScale;
            ctx.strokeStyle = 'rgba(255, 71, 87, 0.5)';
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(padding.left, tolY);
            ctx.lineTo(width - padding.right, tolY);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();

            history.forEach((point, i) => {
                const x = padding.left + point.iteration * xScale;
                const y = padding.top + (logMax - Math.log10(point.error)) * yScale;

                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            });

            ctx.stroke();

            ctx.fillStyle = color;
            history.forEach(point => {
                const x = padding.left + point.iteration * xScale;
                const y = padding.top + (logMax - Math.log10(point.error)) * yScale;
                ctx.beginPath();
                ctx.arc(x, y, 2, 0, 2 * Math.PI);
                ctx.fill();
            });

            ctx.fillStyle = '#8b949e';
            ctx.font = '9px JetBrains Mono';
            ctx.textAlign = 'center';
            ctx.fillText('Iterations', width / 2, height - 3);
        }

        function updateComparisonCharts() {
            const iterCanvas = document.getElementById('iterationChart');
            const iterCtx = iterCanvas.getContext('2d');
            const iterRect = iterCanvas.parentElement.getBoundingClientRect();
            iterCanvas.width = iterRect.width - 40;
            iterCanvas.height = iterRect.height - 50;

            drawScatterChart(iterCtx, iterCanvas, 'iterations', 'finalError');

            const timeCanvas = document.getElementById('timeChart');
            const timeCtx = timeCanvas.getContext('2d');
            const timeRect = timeCanvas.parentElement.getBoundingClientRect();
            timeCanvas.width = timeRect.width - 40;
            timeCanvas.height = timeRect.height - 50;

            drawBarChart(timeCtx, timeCanvas);
        }

        function drawScatterChart(ctx, canvas, xKey, yKey) {
            const width = canvas.width;
            const height = canvas.height;
            const padding = { top: 20, right: 20, bottom: 40, left: 60 };

            ctx.fillStyle = '#1a2129';
            ctx.fillRect(0, 0, width, height);

            const data = Object.values(state.results).filter(r => r && r.converged);
            if (data.length === 0) return;

            const xValues = data.map(d => d[xKey]);
            const yValues = data.map(d => Math.log10(d[yKey]));

            const xMin = 0;
            const xMax = Math.max(...xValues) * 1.1;
            const yMin = Math.min(...yValues) - 1;
            const yMax = Math.max(...yValues) + 1;

            const xScale = (width - padding.left - padding.right) / (xMax - xMin);
            const yScale = (height - padding.top - padding.bottom) / (yMax - yMin);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= 5; i++) {
                const y = padding.top + i * (height - padding.top - padding.bottom) / 5;
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(width - padding.right, y);
                ctx.stroke();
            }

            data.forEach((d, i) => {
                const algo = algorithms.find(a => a.id === d.algorithm);
                const x = padding.left + (d[xKey] - xMin) * xScale;
                const y = padding.top + (yMax - Math.log10(d[yKey])) * yScale;

                ctx.fillStyle = algo.color;
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, 2 * Math.PI);
                ctx.fill();
            });

            ctx.fillStyle = '#8b949e';
            ctx.font = '11px JetBrains Mono';
            ctx.textAlign = 'center';
            ctx.fillText('反復回数', width / 2, height - 5);

            ctx.save();
            ctx.translate(15, height / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText('log₁₀(誤差)', 0, 0);
            ctx.restore();
        }

        function drawBarChart(ctx, canvas) {
            const width = canvas.width;
            const height = canvas.height;
            const padding = { top: 20, right: 20, bottom: 60, left: 60 };

            ctx.fillStyle = '#1a2129';
            ctx.fillRect(0, 0, width, height);

            const data = Object.values(state.results)
                .filter(r => r && r.converged)
                .sort((a, b) => a.time - b.time)
                .slice(0, 10);

            if (data.length === 0) return;

            const maxTime = Math.max(...data.map(d => d.time));
            const barWidth = (width - padding.left - padding.right) / data.length - 5;

            data.forEach((d, i) => {
                const algo = algorithms.find(a => a.id === d.algorithm);
                const x = padding.left + i * (barWidth + 5);
                const barHeight = (d.time / maxTime) * (height - padding.top - padding.bottom);
                const y = height - padding.bottom - barHeight;

                ctx.fillStyle = algo.color;
                ctx.fillRect(x, y, barWidth, barHeight);

                ctx.save();
                ctx.fillStyle = '#8b949e';
                ctx.font = '9px JetBrains Mono';
                ctx.translate(x + barWidth / 2, height - padding.bottom + 5);
                ctx.rotate(Math.PI / 4);
                ctx.textAlign = 'left';
                ctx.fillText(algo.name.substring(0, 15), 0, 0);
                ctx.restore();

                ctx.fillStyle = '#e6edf3';
                ctx.font = '10px JetBrains Mono';
                ctx.textAlign = 'center';
                ctx.fillText(d.time.toFixed(1), x + barWidth / 2, y - 5);
            });
        }

        function updateResultsTable() {
            const tbody = document.getElementById('resultsBody');
            tbody.innerHTML = '';

            const sortedResults = Object.values(state.results)
                .filter(r => r !== null)
                .sort((a, b) => {
                    if (a.converged !== b.converged) return b.converged - a.converged;
                    if (a.converged) return a.iterations - b.iterations;
                    return a.finalError - b.finalError;
                });

            sortedResults.forEach((result, index) => {
                const algo = algorithms.find(a => a.id === result.algorithm);
                const row = document.createElement('tr');

                let rankBadge = '';
                if (result.converged && index < 3) {
                    rankBadge = `<span class="rank-badge rank-${index + 1}">${index + 1}</span>`;
                } else {
                    rankBadge = `${index + 1}`;
                }

                const statusClass = result.converged ? 'status-converged' : 'status-diverged';
                const statusText = result.converged ? '収束' : '発散';

                row.innerHTML = `
                    <td>${rankBadge}</td>
                    <td style="color: ${algo.color}">${algo.name}</td>
                    <td>${algo.category}</td>
                    <td>${result.iterations}</td>
                    <td>${result.finalError.toExponential(2)}</td>
                    <td>${result.time.toFixed(2)} ms</td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                `;

                tbody.appendChild(row);
            });
        }

        /**
         * Reset All Results
         *
         * @description Clears all algorithm results, regenerates the network
         * with new MATPOWER case data, and resets the UI to initial state.
         */
        function resetAll() {
            state.results = {};

            // Reset algorithm cards
            algorithms.forEach(algo => {
                const card = document.getElementById(`card-${algo.id}`);
                card.className = 'algorithm-card';
                document.getElementById(`iter-${algo.id}`).textContent = '-';
                document.getElementById(`error-${algo.id}`).textContent = '-';
                document.getElementById(`time-${algo.id}`).textContent = '-';
                clearCanvas(`chart-${algo.id}`);
            });

            // Clear comparison charts
            clearCanvas('iterationChart');
            clearCanvas('timeChart');

            // Reset results table and progress
            document.getElementById('resultsBody').innerHTML = '';
            document.getElementById('progressContainer').style.display = 'none';

            // Regenerate network with fresh MATPOWER case data
            generateNetwork();
            drawNetworkCanvas();
        }

        window.addEventListener('resize', () => {
            drawNetworkCanvas();
            if (Object.keys(state.results).length > 0) {
                algorithms.forEach(algo => {
                    if (state.results[algo.id]) {
                        drawConvergenceChart(`chart-${algo.id}`, state.results[algo.id].history, algo.color);
                    }
                });
                updateComparisonCharts();
            }
        });
    </script>
