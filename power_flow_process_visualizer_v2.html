        /**
         * Initializes a power network from predefined configurations.
         *
         * Deep copies bus and branch data from the networks dictionary,
         * calculates circular layout positions for visualization, and
         * constructs the Y-bus admittance matrix.
         *
         * @param {string} networkId - Network identifier ('3bus', '5bus', '9bus', '14bus', '30bus')
         */
        function initNetwork(networkId) {
            const net = networks[networkId];
            state.buses = JSON.parse(JSON.stringify(net.buses));
            state.branches = JSON.parse(JSON.stringify(net.branches));

            // Calculate bus positions
            const n = state.buses.length;
            const canvas = document.getElementById('networkCanvas');
            const rect = canvas.getBoundingClientRect();
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const radius = Math.min(rect.width, rect.height) * 0.35;

            state.busPositions = state.buses.map((bus, i) => ({
                x: centerX + radius * Math.cos(2 * Math.PI * i / n - Math.PI / 2),
                y: centerY + radius * Math.sin(2 * Math.PI * i / n - Math.PI / 2)
            }));

            // Build Ybus
            buildYbus();
        }

        /**
         * Constructs the Y-bus admittance matrix from branch data.
         *
         * For each branch with impedance Z = r + jx:
         *   - Calculates admittance y = 1/Z = (r - jx)/(r² + x²)
         *   - Sets off-diagonal elements: Yij = Yji = -y
         *   - Adds to diagonal elements: Yii += y + jb/2 (shunt susceptance)
         *
         * Special handling for transformers (r ≈ 0): Uses pure reactance model.
         */
        function buildYbus() {
            const n = state.buses.length;
            state.Ybus = Array(n).fill(null).map(() => 
                Array(n).fill(null).map(() => ({ re: 0, im: 0 }))
            );

            state.branches.forEach(branch => {
                const { from, to, r, x, b } = branch;
                const denom = r * r + x * x;
                
                let g, bLine;
                if (denom < 1e-12) {
                    // Transformer (pure reactance, r ≈ 0)
                    g = 0;
                    bLine = -1 / x;
                } else {
                    g = r / denom;
                    bLine = -x / denom;
                }

                // Off-diagonal
                state.Ybus[from][to].re -= g;
                state.Ybus[from][to].im -= bLine;
                state.Ybus[to][from].re -= g;
                state.Ybus[to][from].im -= bLine;

                // Diagonal
                state.Ybus[from][from].re += g;
                state.Ybus[from][from].im += bLine + b / 2;
                state.Ybus[to][to].re += g;
                state.Ybus[to][to].im += bLine + b / 2;
            });
        }

        // ================================================================
        // Drawing Functions
        // ================================================================

        /**
         * Renders the complete network visualization on the main canvas.
         *
         * Performs the following steps:
         *   1. Clears and resizes canvas to match container
         *   2. Recalculates bus positions in circular layout
         *   3. Draws all branches with power flow arrows
         *   4. Draws all bus nodes with mismatch indicators
         *   5. Updates the Jacobian structure visualization
         */
        function drawNetwork() {
            const canvas = document.getElementById('networkCanvas');
            const ctx = canvas.getContext('2d');
            const rect = canvas.parentElement.getBoundingClientRect();
            
            canvas.width = rect.width;
            canvas.height = rect.height;

            // Clear
            ctx.fillStyle = '#0d1117';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update positions based on canvas size
            const n = state.buses.length;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(canvas.width, canvas.height) * 0.35;

            state.busPositions = state.buses.map((bus, i) => ({
                x: centerX + radius * Math.cos(2 * Math.PI * i / n - Math.PI / 2),
                y: centerY + radius * Math.sin(2 * Math.PI * i / n - Math.PI / 2)
            }));

            // Draw branches with power flow
            state.branches.forEach(branch => {
                const from = state.busPositions[branch.from];
                const to = state.busPositions[branch.to];

                // Line
                ctx.beginPath();
                ctx.moveTo(from.x, from.y);
                ctx.lineTo(to.x, to.y);
                ctx.strokeStyle = 'rgba(88, 166, 255, 0.4)';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Flow animation
                if (state.running || state.iteration > 0) {
                    const flow = calculateBranchFlow(branch);
                    drawFlowArrow(ctx, from, to, flow);
                }
            });

            // Draw buses
            state.buses.forEach((bus, i) => {
                const pos = state.busPositions[i];
                const mismatch = calculateBusMismatch(bus);
                
                drawBusNode(ctx, bus, pos, mismatch);
            });

            // Draw Jacobian
            drawJacobian();
        }

        /**
         * Draws a single bus node on the network canvas.
         *
         * Node appearance is determined by:
         *   - Bus type: Slack (green), PV (orange), PQ (cyan)
         *   - Mismatch magnitude: Red glow overlay for high mismatch
         *   - Network size: Adaptive radius and font sizes
         *
         * Displays bus number, voltage magnitude, and phase angle labels
         * (labels omitted for large networks to avoid clutter).
         *
         * @param {CanvasRenderingContext2D} ctx - Canvas rendering context
         * @param {Object} bus - Bus data object with id, type, V, delta properties
         * @param {{x: number, y: number}} pos - Canvas coordinates for bus center
         * @param {{P: number, Q: number}} mismatch - Power mismatch values
         */
        function drawBusNode(ctx, bus, pos, mismatch) {
            const n = state.buses.length;
            // Adaptive sizing based on network size
            const baseRadius = n <= 14 ? 30 : n <= 30 ? 20 : 12;
            const radius = baseRadius;
            const maxMismatch = Math.max(Math.abs(mismatch.P), Math.abs(mismatch.Q));

            // Glow effect for high mismatch (skip for very large networks)
            if (maxMismatch > 0.01 && n <= 30) {
                const glowRadius = radius + 15 * Math.min(maxMismatch, 1);
                const gradient = ctx.createRadialGradient(pos.x, pos.y, radius, pos.x, pos.y, glowRadius);
                gradient.addColorStop(0, 'rgba(248, 81, 73, 0.5)');
                gradient.addColorStop(1, 'rgba(248, 81, 73, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, glowRadius, 0, 2 * Math.PI);
                ctx.fill();
            }

            // Node circle
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, radius, 0, 2 * Math.PI);
            
            let fillColor;
            if (bus.type === 'Slack') fillColor = '#3fb950';
            else if (bus.type === 'PV') fillColor = '#d29922';
            else fillColor = '#58a6ff';

            // Mix with red based on mismatch
            if (maxMismatch > 0.001 && bus.type !== 'Slack') {
                const redMix = Math.min(maxMismatch * 5, 0.8);
                ctx.fillStyle = fillColor;
                ctx.fill();
                ctx.fillStyle = `rgba(248, 81, 73, ${redMix})`;
                ctx.fill();
            } else {
                ctx.fillStyle = fillColor;
                ctx.fill();
            }

            ctx.strokeStyle = '#c9d1d9';
            ctx.lineWidth = n <= 30 ? 2 : 1;
            ctx.stroke();

            // Bus number - adaptive font size
            ctx.fillStyle = '#0d1117';
            const fontSize = n <= 14 ? 14 : n <= 30 ? 11 : 8;
            ctx.font = `bold ${fontSize}px JetBrains Mono`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(bus.id + 1, pos.x, pos.y);

            // Voltage magnitude - only show for smaller networks
            if (n <= 30) {
                ctx.fillStyle = '#c9d1d9';
                const labelSize = n <= 14 ? 11 : 9;
                ctx.font = `${labelSize}px JetBrains Mono`;
                ctx.fillText(`|V|=${bus.V.toFixed(3)}`, pos.x, pos.y + radius + 12);
                if (n <= 20) {
                    ctx.fillText(`δ=${(bus.delta * 180 / Math.PI).toFixed(1)}°`, pos.x, pos.y + radius + 24);
                }
            }
        }

        /**
         * Draws a power flow direction arrow on a branch.
         *
         * Arrow is placed at the midpoint of the branch and oriented
         * in the direction of positive power flow. Arrow flips 180°
         * when flow is negative.
         *
         * @param {CanvasRenderingContext2D} ctx - Canvas rendering context
         * @param {{x: number, y: number}} from - Start bus position
         * @param {{x: number, y: number}} to - End bus position
         * @param {number} flow - Power flow magnitude (positive = from→to direction)
         */
        function drawFlowArrow(ctx, from, to, flow) {
            const midX = (from.x + to.x) / 2;
            const midY = (from.y + to.y) / 2;
            const angle = Math.atan2(to.y - from.y, to.x - from.x);

            const arrowLen = 10;
            const flowMag = Math.abs(flow) * 20;

            ctx.save();
            ctx.translate(midX, midY);
            ctx.rotate(flow >= 0 ? angle : angle + Math.PI);

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-arrowLen, -5);
            ctx.lineTo(-arrowLen, 5);
            ctx.closePath();
            ctx.fillStyle = 'rgba(88, 166, 255, 0.8)';
            ctx.fill();

            ctx.restore();
        }

        /**
         * Visualizes the Jacobian matrix sparsity pattern.
         *
         * Renders a color-coded spy plot showing the 4 submatrices:
         *   - J11 (∂P/∂δ): Blue cells
         *   - J12 (∂P/∂V): Green cells
         *   - J21 (∂Q/∂δ): Orange cells
         *   - J22 (∂Q/∂V): Purple cells
         *
         * Non-zero entries (where Yij ≠ 0 or i = j) are shown in the
         * corresponding color; zero entries appear as dark background.
         */
        function drawJacobian() {
            const canvas = document.getElementById('jacobianCanvas');
            const ctx = canvas.getContext('2d');
            const rect = canvas.parentElement.getBoundingClientRect();

            canvas.width = rect.width - 20;
            canvas.height = 100;

            ctx.fillStyle = '#21262d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const n = state.buses.length;
            const cellSize = Math.min(canvas.width / (2 * n), canvas.height / (2 * n), 12);
            const offsetX = (canvas.width - 2 * n * cellSize) / 2;
            const offsetY = (canvas.height - 2 * n * cellSize) / 2;

            // Draw Jacobian structure
            for (let i = 0; i < n; i++) {
                for (let j = 0; j < n; j++) {
                    const hasConnection = state.Ybus[i][j].re !== 0 || state.Ybus[i][j].im !== 0 || i === j;
                    
                    // J11 (dP/dδ)
                    ctx.fillStyle = hasConnection ? '#58a6ff' : '#161b22';
                    ctx.fillRect(offsetX + j * cellSize, offsetY + i * cellSize, cellSize - 1, cellSize - 1);

                    // J12 (dP/dV)
                    ctx.fillStyle = hasConnection ? '#3fb950' : '#161b22';
                    ctx.fillRect(offsetX + (n + j) * cellSize, offsetY + i * cellSize, cellSize - 1, cellSize - 1);

                    // J21 (dQ/dδ)
                    ctx.fillStyle = hasConnection ? '#d29922' : '#161b22';
                    ctx.fillRect(offsetX + j * cellSize, offsetY + (n + i) * cellSize, cellSize - 1, cellSize - 1);

                    // J22 (dQ/dV)
                    ctx.fillStyle = hasConnection ? '#a371f7' : '#161b22';
                    ctx.fillRect(offsetX + (n + j) * cellSize, offsetY + (n + i) * cellSize, cellSize - 1, cellSize - 1);
                }
            }

            // Labels
            ctx.fillStyle = '#8b949e';
            ctx.font = '9px JetBrains Mono';
            ctx.textAlign = 'center';
            ctx.fillText('∂P/∂δ', offsetX + n * cellSize / 2, offsetY - 5);
            ctx.fillText('∂P/∂V', offsetX + n * cellSize * 1.5, offsetY - 5);
        }

        // ================================================================
        // Power Flow Calculation Functions
        // ================================================================

        /**
         * Calculates the power mismatch (ΔP, ΔQ) for a single bus.
         *
         * Power injections are computed using:
         *   P = Σ |Vi||Vj||Yij| cos(θij - δi + δj)
         *   Q = Σ |Vi||Vj||Yij| sin(θij - δi + δj)
         *
         * Mismatch is the difference between specified and calculated values.
         * For Slack buses, mismatch is always zero (P, Q are free variables).
         * For PV buses, only P mismatch is meaningful (Q is free variable).
         *
         * @param {Object} bus - Bus object with V, delta, Pspec, Qspec, type properties
         * @returns {{P: number, Q: number}} Power mismatches ΔP and ΔQ
         */
        function calculateBusMismatch(bus) {
            if (bus.type === 'Slack') return { P: 0, Q: 0 };

            const n = state.buses.length;
            let Pcalc = 0, Qcalc = 0;

            for (let j = 0; j < n; j++) {
                const Vj = state.buses[j].V;
                const dj = state.buses[j].delta;
                const Gij = state.Ybus[bus.id][j].re;
                const Bij = state.Ybus[bus.id][j].im;
                const thetaij = bus.delta - dj;

                Pcalc += bus.V * Vj * (Gij * Math.cos(thetaij) + Bij * Math.sin(thetaij));
                Qcalc += bus.V * Vj * (Gij * Math.sin(thetaij) - Bij * Math.cos(thetaij));
            }

            if (bus.type === 'PV') {
                // PVバス: P指定、V指定（Qは計算値として扱う）
                return {
                    P: bus.Pspec - Pcalc,
                    Q: 0  // PVバスでは無効電力は制約なし
                };
            } else {
                // PQバス: P指定、Q指定
                return {
                    P: bus.Pspec - Pcalc,
                    Q: bus.Qspec - Qcalc
                };
            }
        }

        /**
         * Calculates the real power flow on a transmission line.
         *
         * Uses the power flow equation:
         *   Pij = Vi² × g - Vi × Vj × (g×cos(δi-δj) + b×sin(δi-δj))
         *
         * where g and b are the line conductance and susceptance derived
         * from the branch impedance Z = r + jx.
         *
         * @param {Object} branch - Branch object with from, to, r, x properties
         * @returns {number} Real power flow Pij (positive = from→to)
         */
        function calculateBranchFlow(branch) {
            const Vi = state.buses[branch.from].V;
            const Vj = state.buses[branch.to].V;
            const di = state.buses[branch.from].delta;
            const dj = state.buses[branch.to].delta;

            const { r, x } = branch;
            const denom = r * r + x * x;
            const g = r / denom;
            const b = -x / denom;

            const Pij = Vi * Vi * g - Vi * Vj * (g * Math.cos(di - dj) + b * Math.sin(di - dj));
            return Pij;
        }

        /**
         * Finds the maximum power mismatch across all buses.
         *
         * Iterates through all buses, calculates their P and Q mismatches,
         * and returns the largest absolute value found. Used for convergence
         * checking against the tolerance threshold.
         *
         * @returns {number} Maximum of max(|ΔP|, |ΔQ|) across all buses
         */
        function getMaxMismatch() {
            let maxP = 0, maxQ = 0;
            state.buses.forEach(bus => {
                const mismatch = calculateBusMismatch(bus);
                maxP = Math.max(maxP, Math.abs(mismatch.P));
                maxQ = Math.max(maxQ, Math.abs(mismatch.Q));
            });
            return Math.max(maxP, maxQ);
        }

        // ================================================================
        // Algorithm Implementations
        // ================================================================

        /**
         * Dispatches to the appropriate power flow algorithm implementation.
         *
         * Routes execution to one of:
         *   - Newton-Raphson: Quadratic convergence, full Jacobian
         *   - Gauss-Seidel: Linear convergence, simple update
         *   - Fast Decoupled: Approximated Jacobian, separate P-δ and Q-V
         *   - DC Power Flow: Linear approximation, single iteration
         *   - Gauss (Jacobi): Parallel-friendly simultaneous update
         *
         * @async
         * @returns {Promise<void>}
         */
        async function runIteration() {
            const algo = state.algorithm;

            switch (algo) {
                case 'newton-raphson':
                    await runNewtonRaphson();
                    break;
                case 'gauss-seidel':
                    await runGaussSeidel();
                    break;
                case 'fast-decoupled':
                    await runFastDecoupled();
                    break;
                case 'dc-power-flow':
                    await runDCPowerFlow();
                    break;
                case 'gauss':
                    await runGauss();
                    break;
            }
        }

        // ================================================================
        // Matrix Operations (Linear Algebra)
        // ================================================================

        /**
         * Solves the linear system Ax = b using Gaussian elimination.
         *
         * Implements Gaussian elimination with partial pivoting:
         *   1. Forward elimination with row swapping for numerical stability
         *   2. Back substitution to obtain solution vector
         *
         * Handles near-singular matrices by checking pivot magnitudes
         * and issuing console warnings when detected.
         *
         * @param {number[][]} A - Coefficient matrix (n × n)
         * @param {number[]} b - Right-hand side vector (length n)
         * @returns {number[]} Solution vector x (length n)
         */
        function solveLinearSystem(A, b) {
            const n = A.length;
            // Create augmented matrix (deep copy)
            const aug = [];
            for (let i = 0; i < n; i++) {
                aug.push([...A[i], b[i]]);
            }
            
            // Forward elimination with partial pivoting
            for (let col = 0; col < n; col++) {
                // Find pivot
                let maxRow = col;
                let maxVal = Math.abs(aug[col][col]);
                for (let row = col + 1; row < n; row++) {
                    if (Math.abs(aug[row][col]) > maxVal) {
                        maxVal = Math.abs(aug[row][col]);
                        maxRow = row;
                    }
                }
                
                // Swap rows
                if (maxRow !== col) {
                    [aug[col], aug[maxRow]] = [aug[maxRow], aug[col]];
                }
                
                // Check for singular matrix
                if (Math.abs(aug[col][col]) < 1e-15) {
                    console.warn('Near-singular matrix at column', col);
                    continue;
                }
                
                // Eliminate below
                for (let row = col + 1; row < n; row++) {
                    const factor = aug[row][col] / aug[col][col];
                    for (let j = col; j <= n; j++) {
                        aug[row][j] -= factor * aug[col][j];
                    }
                }
            }
            
            // Back substitution
            const x = new Array(n).fill(0);
            for (let i = n - 1; i >= 0; i--) {
                let sum = aug[i][n];
                for (let j = i + 1; j < n; j++) {
                    sum -= aug[i][j] * x[j];
                }
                x[i] = Math.abs(aug[i][i]) > 1e-15 ? sum / aug[i][i] : 0;
            }
            
            return x;
        }
        
        /**
         * Calculates P and Q power injections for a specific bus.
         *
         * Uses the AC power flow equations:
         *   P = Σ |Vi||Vj|(Gij×cos(δi-δj) + Bij×sin(δi-δj))
         *   Q = Σ |Vi||Vj|(Gij×sin(δi-δj) - Bij×cos(δi-δj))
         *
         * @param {number} busIdx - Index of the bus (0-based)
         * @returns {{P: number, Q: number}} Calculated P and Q injections
         */
        function calculatePQ(busIdx) {
            const bus = state.buses[busIdx];
            const n = state.buses.length;
            let P = 0, Q = 0;
            
            for (let j = 0; j < n; j++) {
                const Vj = state.buses[j].V;
                const thetaij = bus.delta - state.buses[j].delta;
                const Gij = state.Ybus[busIdx][j].re;
                const Bij = state.Ybus[busIdx][j].im;
                
                P += bus.V * Vj * (Gij * Math.cos(thetaij) + Bij * Math.sin(thetaij));
                Q += bus.V * Vj * (Gij * Math.sin(thetaij) - Bij * Math.cos(thetaij));
            }
            
            return { P, Q };
        }
        
        /**
         * Builds the full Jacobian matrix for Newton-Raphson power flow.
         *
         * Constructs the standard 4-submatrix Jacobian:
         *   J = [H  N]  where H = ∂P/∂δ (nNonSlack × nNonSlack)
         *       [M  L]        N = ∂P/∂V (nNonSlack × nPQ)
         *                     M = ∂Q/∂δ (nPQ × nNonSlack)
         *                     L = ∂Q/∂V (nPQ × nPQ)
         *
         * Also computes the mismatch vector [ΔP; ΔQ] and returns bus mappings.
         *
         * @returns {{J: number[][], mismatch: number[], nonSlackBuses: number[], pqBuses: number[], nNonSlack: number, nPQ: number}}
         */
        function buildFullJacobian() {
            const n = state.buses.length;
            
            // Identify bus types and create index mappings
            const pqBuses = [];  // Buses where both P and Q are specified
            const pvBuses = [];  // Buses where P and V are specified
            
            for (let i = 0; i < n; i++) {
                if (state.buses[i].type === 'PQ') {
                    pqBuses.push(i);
                } else if (state.buses[i].type === 'PV') {
                    pvBuses.push(i);
                }
            }
            
            // Non-slack buses (all buses with delta as variable)
            const nonSlackBuses = [...pqBuses, ...pvBuses];
            nonSlackBuses.sort((a, b) => a - b);  // Sort by bus index
            
            // Also sort pqBuses for consistency
            pqBuses.sort((a, b) => a - b);
            
            const nNonSlack = nonSlackBuses.length;
            const nPQ = pqBuses.length;
            
            // Create mapping from bus index to position in nonSlackBuses
            const busToNonSlackIdx = {};
            for (let idx = 0; idx < nNonSlack; idx++) {
                busToNonSlackIdx[nonSlackBuses[idx]] = idx;
            }
            
            // Create mapping from bus index to position in pqBuses
            const busToPQIdx = {};
            for (let idx = 0; idx < nPQ; idx++) {
                busToPQIdx[pqBuses[idx]] = idx;
            }
            
            // Build mismatch vector: [ΔP for all non-slack, ΔQ for PQ buses]
            const mismatch = [];
            
            // P mismatches for all non-slack buses
            for (const i of nonSlackBuses) {
                const bus = state.buses[i];
                const { P } = calculatePQ(i);
                mismatch.push(bus.Pspec - P);
            }
            
            // Q mismatches for PQ buses only
            for (const i of pqBuses) {
                const bus = state.buses[i];
                const { Q } = calculatePQ(i);
                mismatch.push(bus.Qspec - Q);
            }
            
            // Jacobian dimension: nNonSlack (for δ) + nPQ (for V)
            const dimJ = nNonSlack + nPQ;
            const J = Array(dimJ).fill(null).map(() => Array(dimJ).fill(0));
            
            // Build Jacobian using standard power flow formulas
            // J = [H  N ]   where H = ∂P/∂δ, N = ∂P/∂V
            //     [M  L ]         M = ∂Q/∂δ, L = ∂Q/∂V
            
            // H submatrix: ∂P/∂δ (nNonSlack x nNonSlack)
            for (let ii = 0; ii < nNonSlack; ii++) {
                const i = nonSlackBuses[ii];
                const Vi = state.buses[i].V;
                const deltai = state.buses[i].delta;
                
                for (let jj = 0; jj < nNonSlack; jj++) {
                    const j = nonSlackBuses[jj];
                    const Vj = state.buses[j].V;
                    const deltaj = state.buses[j].delta;
                    const thetaij = deltai - deltaj;
                    const Gij = state.Ybus[i][j].re;
                    const Bij = state.Ybus[i][j].im;
                    
                    if (i === j) {
                        // Diagonal: H_ii = -Q_i - V_i^2 * B_ii
                        const { Q } = calculatePQ(i);
                        J[ii][jj] = -Q - Vi * Vi * state.Ybus[i][i].im;
                    } else {
                        // Off-diagonal: H_ij = V_i * V_j * (G_ij * sin(θ_ij) - B_ij * cos(θ_ij))
                        J[ii][jj] = Vi * Vj * (Gij * Math.sin(thetaij) - Bij * Math.cos(thetaij));
                    }
                }
            }
            
            // N submatrix: ∂P/∂V (nNonSlack x nPQ)
            for (let ii = 0; ii < nNonSlack; ii++) {
                const i = nonSlackBuses[ii];
                const Vi = state.buses[i].V;
                const deltai = state.buses[i].delta;
                
                for (let jj = 0; jj < nPQ; jj++) {
                    const j = pqBuses[jj];
                    const Vj = state.buses[j].V;
                    const deltaj = state.buses[j].delta;
                    const thetaij = deltai - deltaj;
                    const Gij = state.Ybus[i][j].re;
                    const Bij = state.Ybus[i][j].im;
                    
                    if (i === j) {
                        // Diagonal: N_ii = P_i/V_i + V_i * G_ii
                        const { P } = calculatePQ(i);
                        J[ii][nNonSlack + jj] = P / Vi + Vi * state.Ybus[i][i].re;
                    } else {
                        // Off-diagonal: N_ij = V_i * (G_ij * cos(θ_ij) + B_ij * sin(θ_ij))
                        J[ii][nNonSlack + jj] = Vi * (Gij * Math.cos(thetaij) + Bij * Math.sin(thetaij));
                    }
                }
            }
            
            // M submatrix: ∂Q/∂δ (nPQ x nNonSlack)
            for (let ii = 0; ii < nPQ; ii++) {
                const i = pqBuses[ii];
                const Vi = state.buses[i].V;
                const deltai = state.buses[i].delta;
                
                for (let jj = 0; jj < nNonSlack; jj++) {
                    const j = nonSlackBuses[jj];
                    const Vj = state.buses[j].V;
                    const deltaj = state.buses[j].delta;
                    const thetaij = deltai - deltaj;
                    const Gij = state.Ybus[i][j].re;
                    const Bij = state.Ybus[i][j].im;
                    
                    if (i === j) {
                        // Diagonal: M_ii = P_i - V_i^2 * G_ii
                        const { P } = calculatePQ(i);
                        J[nNonSlack + ii][jj] = P - Vi * Vi * state.Ybus[i][i].re;
                    } else {
                        // Off-diagonal: M_ij = -V_i * V_j * (G_ij * cos(θ_ij) + B_ij * sin(θ_ij))
                        J[nNonSlack + ii][jj] = -Vi * Vj * (Gij * Math.cos(thetaij) + Bij * Math.sin(thetaij));
                    }
                }
            }
            
            // L submatrix: ∂Q/∂V (nPQ x nPQ)
            for (let ii = 0; ii < nPQ; ii++) {
                const i = pqBuses[ii];
                const Vi = state.buses[i].V;
                const deltai = state.buses[i].delta;
                
                for (let jj = 0; jj < nPQ; jj++) {
                    const j = pqBuses[jj];
                    const Vj = state.buses[j].V;
                    const deltaj = state.buses[j].delta;
                    const thetaij = deltai - deltaj;
                    const Gij = state.Ybus[i][j].re;
                    const Bij = state.Ybus[i][j].im;
                    
                    if (i === j) {
                        // Diagonal: L_ii = Q_i/V_i - V_i * B_ii
                        const { Q } = calculatePQ(i);
                        J[nNonSlack + ii][nNonSlack + jj] = Q / Vi - Vi * state.Ybus[i][i].im;
                    } else {
                        // Off-diagonal: L_ij = V_i * (G_ij * sin(θ_ij) - B_ij * cos(θ_ij))
                        J[nNonSlack + ii][nNonSlack + jj] = Vi * (Gij * Math.sin(thetaij) - Bij * Math.cos(thetaij));
                    }
                }
            }
            
            return { J, mismatch, nonSlackBuses, pqBuses, nNonSlack, nPQ };
        }
        
        /**
         * Builds B' and B'' matrices for the Fast Decoupled power flow method.
         *
         * The Fast Decoupled method uses simplified susceptance matrices:
         *   B' (for P-δ subproblem): Derived from -B (susceptance)
         *   B'' (for Q-V subproblem): Derived from -B (susceptance)
         *
         * Both matrices ignore resistance and assume voltage magnitudes ≈ 1.0.
         *
         * @returns {{Bp: number[][], Bpp: number[][], nonSlackBuses: number[], pqBuses: number[], nNonSlack: number, nPQ: number}}
         */
        function buildBMatrices() {
            const n = state.buses.length;
            
            // Identify bus types
            const pqBuses = [];
            const nonSlackBuses = [];
            
            for (let i = 0; i < n; i++) {
                if (state.buses[i].type === 'PQ') {
                    pqBuses.push(i);
                    nonSlackBuses.push(i);
                } else if (state.buses[i].type === 'PV') {
                    nonSlackBuses.push(i);
                }
            }
            
            const nNonSlack = nonSlackBuses.length;
            const nPQ = pqBuses.length;
            
            // B' matrix for P-delta subproblem (size: nNonSlack x nNonSlack)
            // B'_ij = -B_ij (off-diagonal), B'_ii = sum of B_ik for all k connected to i
            const Bp = Array(nNonSlack).fill(null).map(() => Array(nNonSlack).fill(0));
            
            for (let ii = 0; ii < nNonSlack; ii++) {
                const i = nonSlackBuses[ii];
                for (let jj = 0; jj < nNonSlack; jj++) {
                    const j = nonSlackBuses[jj];
                    if (i === j) {
                        // Diagonal: sum of susceptances
                        Bp[ii][jj] = -state.Ybus[i][i].im;
                    } else {
                        // Off-diagonal: negative of susceptance
                        Bp[ii][jj] = -state.Ybus[i][j].im;
                    }
                }
            }
            
            // B'' matrix for Q-V subproblem (size: nPQ x nPQ)
            const Bpp = Array(nPQ).fill(null).map(() => Array(nPQ).fill(0));
            
            for (let ii = 0; ii < nPQ; ii++) {
                const i = pqBuses[ii];
                for (let jj = 0; jj < nPQ; jj++) {
                    const j = pqBuses[jj];
                    if (i === j) {
                        // Diagonal
                        Bpp[ii][jj] = -state.Ybus[i][i].im;
                    } else {
                        // Off-diagonal
                        Bpp[ii][jj] = -state.Ybus[i][j].im;
                    }
                }
            }
            
            return { Bp, Bpp, nonSlackBuses, pqBuses, nNonSlack, nPQ };
        }

        /**
         * Executes one Newton-Raphson iteration with animation.
         *
         * Newton-Raphson achieves quadratic convergence by solving:
         *   [Δδ]   -1   [ΔP]
         *   [ΔV] = J  × [ΔQ]
         *
         * Steps performed with visualization:
         *   1. Calculate power mismatches ΔP, ΔQ
         *   2. Build full Jacobian matrix J
         *   3. Solve linear system J × Δx = mismatch
         *   4. Update state variables δ, V
         *   5. Check convergence criterion
         *
         * @async
         * @returns {Promise<void>}
         */
        async function runNewtonRaphson() {
            // Step 1: Calculate mismatches
            await animateStep('mismatch', 'ミスマッチ ΔP, ΔQ 計算中...');
            
            const n = state.buses.length;
            
            updateEquationDisplay(`ミスマッチ計算:
<span class="eq-variable">ΔP_i</span> = P_spec - Σ|V_i||V_j||Y_ij|cos(θ_ij - δ_i + δ_j)
<span class="eq-variable">ΔQ_i</span> = Q_spec - Σ|V_i||V_j||Y_ij|sin(θ_ij - δ_i + δ_j)

最大誤差: ${getMaxMismatch().toExponential(3)}`);

            await delay(800 / state.speed);

            // Step 2: Build full Jacobian matrix
            await animateStep('jacobian', 'ヤコビアン行列 J 構築中...');
            
            const { J, mismatch, nonSlackBuses, pqBuses, nNonSlack, nPQ } = buildFullJacobian();
            const dimJ = nNonSlack + nPQ;
            
            updateEquationDisplay(`ヤコビアン行列:
J = [<span class="eq-variable">∂P/∂δ</span>  <span class="eq-variable">∂P/∂V</span>]
    [<span class="eq-variable">∂Q/∂δ</span>  <span class="eq-variable">∂Q/∂V</span>]

サイズ: ${dimJ} × ${dimJ} (非Slackバス)`);

            drawJacobian();
            await delay(600 / state.speed);

            // Step 3: Solve linear system J * dx = mismatch
            await animateStep('solve', '線形方程式 JΔx = Δf を解く...');
            
            updateEquationDisplay(`線形方程式を解く:
[<span class="eq-variable">Δδ</span>]       [<span class="eq-variable">ΔP</span>]
[<span class="eq-variable">ΔV</span>] = J⁻¹ [<span class="eq-variable">ΔQ</span>]

Gauss消去法 (部分ピボット選択) を使用...`);

            await delay(600 / state.speed);
            
            // Solve the linear system
            const dx = solveLinearSystem(J, mismatch);

            // Step 4: Update state variables
            await animateStep('update', '状態変数を更新中...');

            // Update delta for all non-slack buses
            for (let ii = 0; ii < nNonSlack; ii++) {
                const i = nonSlackBuses[ii];
                state.buses[i].delta += dx[ii];
                await highlightBusUpdate(i);
            }
            
            // Update V for PQ buses only
            for (let jj = 0; jj < nPQ; jj++) {
                const j = pqBuses[jj];
                state.buses[j].V += dx[nNonSlack + jj];
                // Apply voltage limits
                state.buses[j].V = Math.max(0.5, Math.min(1.5, state.buses[j].V));
            }

            updateEquationDisplay(`状態更新完了:
<span class="eq-variable">δ</span>^(k+1) = δ^(k) + <span class="eq-highlight">Δδ</span>
<span class="eq-variable">V</span>^(k+1) = V^(k) + <span class="eq-highlight">ΔV</span>

反復 ${state.iteration + 1} 完了`);

            await delay(400 / state.speed);

            // Step 5: Check convergence
            await animateStep('check', '収束判定...');
            
            const maxError = getMaxMismatch();
            updateEquationDisplay(`収束判定:
max(|ΔP|, |ΔQ|) = ${maxError.toExponential(3)}
許容誤差 ε = ${state.tolerance.toExponential(1)}

${maxError < state.tolerance ? '<span class="eq-highlight">✓ 収束!</span>' : '→ 次の反復へ'}`);
        }

        /**
         * Executes one Gauss-Seidel iteration with animation.
         *
         * Gauss-Seidel updates each bus voltage sequentially using:
         *   Vi = (1/Yii) × [(Pi - jQi)/Vi* - Σ(j≠i) Yij × Vj]
         *
         * Features:
         *   - Uses most recent values immediately (sequential update)
         *   - Over-relaxation factor α = 1.4 for faster convergence
         *   - PV buses maintain fixed voltage magnitude
         *   - Linear convergence rate
         *
         * @async
         * @returns {Promise<void>}
         */
        async function runGaussSeidel() {
            await animateStep('update', 'Gauss-Seidel更新中...');

            const n = state.buses.length;

            for (let i = 0; i < n; i++) {
                const bus = state.buses[i];
                if (bus.type === 'Slack') continue;

                // Calculate new voltage using Gauss-Seidel formula:
                // V_i = (1/Y_ii) * [(P_i - jQ_i)/V_i* - sum_{j≠i} Y_ij * V_j]
                
                // For PV buses, first calculate Q from current values
                let Qspec = bus.Qspec;
                if (bus.type === 'PV') {
                    // Calculate reactive power for PV bus
                    let Qcalc = 0;
                    for (let j = 0; j < n; j++) {
                        const Vj = state.buses[j].V;
                        const dj = state.buses[j].delta;
                        const thetaij = bus.delta - dj;
                        const Gij = state.Ybus[i][j].re;
                        const Bij = state.Ybus[i][j].im;
                        Qcalc += bus.V * Vj * (Gij * Math.sin(thetaij) - Bij * Math.cos(thetaij));
                    }
                    Qspec = Qcalc;
                }
                
                // Sum of Y_ij * V_j for j != i
                let sumYV_re = 0, sumYV_im = 0;
                for (let j = 0; j < n; j++) {
                    if (i === j) continue;
                    const Vj = state.buses[j].V;
                    const dj = state.buses[j].delta;
                    const Yij_re = state.Ybus[i][j].re;
                    const Yij_im = state.Ybus[i][j].im;
                    
                    // Y_ij * V_j (complex multiplication)
                    // V_j = Vj * (cos(dj) + j*sin(dj))
                    const Vj_re = Vj * Math.cos(dj);
                    const Vj_im = Vj * Math.sin(dj);
                    
                    sumYV_re += Yij_re * Vj_re - Yij_im * Vj_im;
                    sumYV_im += Yij_re * Vj_im + Yij_im * Vj_re;
                }

                // (P - jQ) / V* = (P - jQ) * V / |V|^2
                const Vi_re = bus.V * Math.cos(bus.delta);
                const Vi_im = bus.V * Math.sin(bus.delta);
                const Vmag_sq = bus.V * bus.V;
                
                // (P - jQ) * (Vi_re + j*Vi_im) / |V|^2
                const PjQ_over_Vconj_re = (bus.Pspec * Vi_re + Qspec * Vi_im) / Vmag_sq;
                const PjQ_over_Vconj_im = (bus.Pspec * Vi_im - Qspec * Vi_re) / Vmag_sq;
                
                // RHS = (P-jQ)/V* - sum(Yij*Vj)
                const rhs_re = PjQ_over_Vconj_re - sumYV_re;
                const rhs_im = PjQ_over_Vconj_im - sumYV_im;
                
                // New V = RHS / Y_ii (complex division)
                const Yii_re = state.Ybus[i][i].re;
                const Yii_im = state.Ybus[i][i].im;
                const Yii_mag_sq = Yii_re * Yii_re + Yii_im * Yii_im;
                
                const newV_re = (rhs_re * Yii_re + rhs_im * Yii_im) / Yii_mag_sq;
                const newV_im = (rhs_im * Yii_re - rhs_re * Yii_im) / Yii_mag_sq;
                
                const newMag = Math.sqrt(newV_re * newV_re + newV_im * newV_im);
                const newAngle = Math.atan2(newV_im, newV_re);

                // Apply with acceleration factor
                const alpha = 1.4; // Over-relaxation for faster convergence
                
                if (bus.type === 'PQ') {
                    bus.V = bus.V + alpha * (newMag - bus.V);
                    bus.V = Math.max(0.8, Math.min(1.2, bus.V));
                }
                // For PV buses, keep voltage magnitude fixed
                
                // Update angle for both PQ and PV buses
                let angleDiff = newAngle - bus.delta;
                // Normalize angle difference to [-pi, pi]
                while (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
                while (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;
                bus.delta = bus.delta + alpha * angleDiff;

                updateEquationDisplay(`Gauss-Seidel更新 (Bus ${i + 1}):
V_${i+1}^(k+1) = 1/Y_${i+1}${i+1} × [
  (P - jQ)/V*
  - Σ Y_${i+1}j × V_j
]

|V| = ${bus.V.toFixed(4)}, δ = ${(bus.delta * 180 / Math.PI).toFixed(2)}°`);

                await highlightBusUpdate(i);
                await delay(300 / state.speed);
            }

            await animateStep('check', '収束判定...');
        }

        /**
         * Executes one Fast Decoupled power flow iteration with animation.
         *
         * The Fast Decoupled method separates P-δ and Q-V subproblems:
         *   1. P-δ subproblem: B' × Δδ = ΔP/V
         *   2. Q-V subproblem: B'' × ΔV = ΔQ/V
         *
         * Advantages:
         *   - Constant B matrices (computed once per network)
         *   - Smaller systems to solve than full Newton-Raphson
         *   - Near-quadratic convergence for well-conditioned systems
         *
         * @async
         * @returns {Promise<void>}
         */
        async function runFastDecoupled() {
            const n = state.buses.length;
            const { Bp, Bpp, nonSlackBuses, pqBuses, nNonSlack, nPQ } = buildBMatrices();

            // P-delta subproblem
            await animateStep('mismatch', 'P-δ サブ問題...');
            
            updateEquationDisplay(`Fast Decoupled法:
<span class="eq-variable">B'</span> × Δδ = ΔP/V

B'行列で位相角を更新...`);

            await delay(500 / state.speed);

            // Calculate P mismatches
            const deltaP = [];
            for (const i of nonSlackBuses) {
                const bus = state.buses[i];
                let Pcalc = 0;
                for (let j = 0; j < n; j++) {
                    const Vj = state.buses[j].V;
                    const thetaij = bus.delta - state.buses[j].delta;
                    const Gij = state.Ybus[i][j].re;
                    const Bij = state.Ybus[i][j].im;
                    Pcalc += bus.V * Vj * (Gij * Math.cos(thetaij) + Bij * Math.sin(thetaij));
                }
                // ΔP/V for fast decoupled
                deltaP.push((bus.Pspec - Pcalc) / bus.V);
            }
            
            // Solve B' * Δδ = ΔP/V
            const dDelta = solveLinearSystem(Bp, deltaP);
            
            // Update delta for non-slack buses
            for (let ii = 0; ii < nNonSlack; ii++) {
                const i = nonSlackBuses[ii];
                state.buses[i].delta += dDelta[ii];
                await highlightBusUpdate(i);
            }

            await delay(400 / state.speed);

            // Q-V subproblem
            await animateStep('update', 'Q-V サブ問題...');
            
            updateEquationDisplay(`Fast Decoupled法:
<span class="eq-variable">B"</span> × ΔV = ΔQ/V

B"行列で電圧を更新...`);

            // Calculate Q mismatches for PQ buses
            const deltaQ = [];
            for (const i of pqBuses) {
                const bus = state.buses[i];
                let Qcalc = 0;
                for (let j = 0; j < n; j++) {
                    const Vj = state.buses[j].V;
                    const thetaij = bus.delta - state.buses[j].delta;
                    const Gij = state.Ybus[i][j].re;
                    const Bij = state.Ybus[i][j].im;
                    Qcalc += bus.V * Vj * (Gij * Math.sin(thetaij) - Bij * Math.cos(thetaij));
                }
                // ΔQ/V for fast decoupled
                deltaQ.push((bus.Qspec - Qcalc) / bus.V);
            }
            
            // Solve B'' * ΔV = ΔQ/V
            if (nPQ > 0) {
                const dV = solveLinearSystem(Bpp, deltaQ);
                
                // Update V for PQ buses
                for (let jj = 0; jj < nPQ; jj++) {
                    const j = pqBuses[jj];
                    state.buses[j].V += dV[jj];
                    state.buses[j].V = Math.max(0.8, Math.min(1.2, state.buses[j].V));
                    await highlightBusUpdate(j);
                }
            }

            await animateStep('check', '収束判定...');
        }

        /**
         * Executes DC power flow calculation with animation.
         *
         * DC power flow is a linear approximation assuming:
         *   - All voltage magnitudes = 1.0 p.u.
         *   - Angle differences are small: sin(δ) ≈ δ
         *   - Line resistance is negligible: r << x
         *
         * Solves: P = B × δ in a single iteration.
         * Does not compute reactive power Q (only real power P and angles δ).
         *
         * @async
         * @returns {Promise<void>}
         */
        async function runDCPowerFlow() {
            await animateStep('init', 'DC潮流計算 (線形)...');

            updateEquationDisplay(`DC潮流計算:
仮定: |V| = 1.0, sin(δ) ≈ δ, r << x

<span class="eq-variable">P</span> = <span class="eq-variable">B</span> × <span class="eq-variable">δ</span>

1回の計算で解を得る`);

            await delay(800 / state.speed);

            await animateStep('solve', '線形方程式を解く...');

            const n = state.buses.length;
            
            // Simple DC power flow update
            for (let i = 0; i < n; i++) {
                const bus = state.buses[i];
                if (bus.type === 'Slack') continue;
                
                let sumB = 0;
                for (let j = 0; j < n; j++) {
                    if (i === j) continue;
                    sumB += state.Ybus[i][j].im * state.buses[j].delta;
                }
                
                bus.delta = (bus.Pspec - sumB) / state.Ybus[i][i].im;
                bus.V = 1.0; // DC assumes flat voltage
            }

            await animateStep('update', '解の計算完了');
            
            updateEquationDisplay(`DC潮流計算完了:
全ノードの位相角 δ を計算

注: 電圧は 1.0 p.u. と仮定
    無効電力 Q は計算されない`);

            // DC power flow converges in 1 iteration
            state.convergenceHistory.push(state.tolerance / 10);
            updateConvergenceChart();
            drawNetwork();
            updateBusTable();
        }

        /**
         * Executes one Gauss (Jacobi) iteration with animation.
         *
         * Unlike Gauss-Seidel, Jacobi method uses all OLD values for
         * computation, then updates all buses simultaneously.
         *
         * Features:
         *   - All bus updates computed from previous iteration values
         *   - Simultaneous update (natural parallelism for hardware)
         *   - Slight over-relaxation (α = 1.2) for faster convergence
         *   - Generally slower convergence than Gauss-Seidel
         *
         * @async
         * @returns {Promise<void>}
         */
        async function runGauss() {
            await animateStep('update', 'Gauss (Jacobi) 更新中...');

            const n = state.buses.length;

            // Store old values (Jacobi uses all old values for computation)
            const oldVoltages = state.buses.map(b => ({
                V: b.V,
                delta: b.delta,
                Pspec: b.Pspec,
                Qspec: b.Qspec
            }));
            
            // New values to compute
            const newValues = state.buses.map(b => ({ V: b.V, delta: b.delta }));
            
            for (let i = 0; i < n; i++) {
                const bus = state.buses[i];
                if (bus.type === 'Slack') continue;

                // For PV buses, calculate Q from OLD values
                let Qspec = bus.Qspec;
                if (bus.type === 'PV') {
                    let Qcalc = 0;
                    for (let j = 0; j < n; j++) {
                        const Vj = oldVoltages[j].V;
                        const dj = oldVoltages[j].delta;
                        const thetaij = oldVoltages[i].delta - dj;
                        const Gij = state.Ybus[i][j].re;
                        const Bij = state.Ybus[i][j].im;
                        Qcalc += oldVoltages[i].V * Vj * (Gij * Math.sin(thetaij) - Bij * Math.cos(thetaij));
                    }
                    Qspec = Qcalc;
                }
                
                // Calculate new voltage using Jacobi formula (all OLD values)
                // V_i = (1/Y_ii) * [(P_i - jQ_i)/V_i* - sum_{j≠i} Y_ij * V_j]
                
                let sumYV_re = 0, sumYV_im = 0;
                for (let j = 0; j < n; j++) {
                    if (i === j) continue;
                    // Use OLD values (key difference from Gauss-Seidel)
                    const Vj = oldVoltages[j].V;
                    const dj = oldVoltages[j].delta;
                    const Yij_re = state.Ybus[i][j].re;
                    const Yij_im = state.Ybus[i][j].im;
                    
                    const Vj_re = Vj * Math.cos(dj);
                    const Vj_im = Vj * Math.sin(dj);
                    
                    sumYV_re += Yij_re * Vj_re - Yij_im * Vj_im;
                    sumYV_im += Yij_re * Vj_im + Yij_im * Vj_re;
                }

                // Use OLD voltage for this bus too
                const Vi_old = oldVoltages[i].V;
                const delta_old = oldVoltages[i].delta;
                const Vi_re = Vi_old * Math.cos(delta_old);
                const Vi_im = Vi_old * Math.sin(delta_old);
                const Vmag_sq = Vi_old * Vi_old;
                
                // (P - jQ) * V / |V|^2
                const PjQ_over_Vconj_re = (bus.Pspec * Vi_re + Qspec * Vi_im) / Vmag_sq;
                const PjQ_over_Vconj_im = (bus.Pspec * Vi_im - Qspec * Vi_re) / Vmag_sq;
                
                // RHS
                const rhs_re = PjQ_over_Vconj_re - sumYV_re;
                const rhs_im = PjQ_over_Vconj_im - sumYV_im;
                
                // Divide by Y_ii
                const Yii_re = state.Ybus[i][i].re;
                const Yii_im = state.Ybus[i][i].im;
                const Yii_mag_sq = Yii_re * Yii_re + Yii_im * Yii_im;
                
                const newV_re = (rhs_re * Yii_re + rhs_im * Yii_im) / Yii_mag_sq;
                const newV_im = (rhs_im * Yii_re - rhs_re * Yii_im) / Yii_mag_sq;
                
                const newMag = Math.sqrt(newV_re * newV_re + newV_im * newV_im);
                const newAngle = Math.atan2(newV_im, newV_re);

                // Store new values (don't update bus yet - Jacobi style)
                if (bus.type === 'PQ') {
                    newValues[i].V = Vi_old + 1.2 * (newMag - Vi_old); // Slight over-relaxation
                    newValues[i].V = Math.max(0.8, Math.min(1.2, newValues[i].V));
                }
                
                let angleDiff = newAngle - delta_old;
                while (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
                while (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;
                newValues[i].delta = delta_old + 1.2 * angleDiff;
            }
            
            // Now update all buses simultaneously (Jacobi characteristic)
            for (let i = 0; i < n; i++) {
                if (state.buses[i].type === 'Slack') continue;
                
                if (state.buses[i].type === 'PQ') {
                    state.buses[i].V = newValues[i].V;
                }
                state.buses[i].delta = newValues[i].delta;
                
                await highlightBusUpdate(i);
            }

            updateEquationDisplay(`Gauss (Jacobi) 法:
全ノードを<span class="eq-highlight">前回の値</span>で同時更新

V_i^(k+1) = f(V^(k)) ← 全て前回値を使用

並列計算に適している`);

            await animateStep('check', '収束判定...');
        }

        // ================================================================
        // Animation Helper Functions
        // ================================================================

        /**
         * Updates the step indicator UI and status message during iteration.
         *
         * Marks previous steps as completed, current step as active,
         * and updates the status text display.
         *
         * @async
         * @param {string} step - Step identifier ('init', 'mismatch', 'jacobian', 'solve', 'update', 'check')
         * @param {string} message - Status message to display
         * @returns {Promise<void>}
         */
        async function animateStep(step, message) {
            state.currentStep = step;
            
            // Update step indicators
            document.querySelectorAll('.step-badge').forEach(badge => {
                badge.classList.remove('active', 'completed');
            });
            
            const steps = ['init', 'mismatch', 'jacobian', 'solve', 'update', 'check'];
            const currentIndex = steps.indexOf(step);
            
            steps.forEach((s, i) => {
                const badge = document.querySelector(`.step-badge[data-step="${s}"]`);
                if (i < currentIndex) badge.classList.add('completed');
                if (i === currentIndex) badge.classList.add('active');
            });

            // Update status
            document.getElementById('statusText').textContent = message;
        }

        /**
         * Highlights a bus node being updated during iteration animation.
         *
         * Creates a flash effect on the canvas and highlights the corresponding
         * table row. For large networks (> 20 buses), animation is skipped
         * to maintain performance.
         *
         * @async
         * @param {number} busIndex - Index of the bus being updated (0-based)
         * @returns {Promise<void>}
         */
        async function highlightBusUpdate(busIndex) {
            // Skip individual bus animation for large networks
            const n = state.buses.length;
            if (n > 20) {
                // For large networks, skip individual highlighting
                return;
            }
            
            // Flash the bus on canvas
            const canvas = document.getElementById('networkCanvas');
            const ctx = canvas.getContext('2d');
            const pos = state.busPositions[busIndex];

            // Draw flash effect
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 45, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(88, 166, 255, 0.4)';
            ctx.fill();

            // Update table row
            const row = document.querySelector(`#busTableBody tr:nth-child(${busIndex + 1})`);
            if (row) {
                row.classList.add('updated');
                setTimeout(() => row.classList.remove('updated'), 500);
            }

            // Redraw
            drawNetwork();
            updateBusTable();

            await delay(150 / state.speed);
        }
        
        /**
         * Batch updates all visualizations after iteration completion.
         *
         * Used primarily for large networks where individual bus animations
         * are skipped for performance reasons.
         */
        function updateVisualization() {
            drawNetwork();
            updateBusTable();
        }

        /**
         * Updates the equation display panel with formatted HTML content.
         *
         * Accepts HTML strings with syntax highlighting classes:
         *   - eq-variable: Variable names
         *   - eq-highlight: Emphasized text
         *   - eq-updating: Currently changing values
         *
         * @param {string} text - HTML content to display
         */
        function updateEquationDisplay(text) {
            document.getElementById('equationDisplay').innerHTML = text;
        }

        /**
         * Returns a Promise that resolves after the specified delay.
         *
         * Used for animation timing between iteration steps.
         *
         * @param {number} ms - Delay duration in milliseconds
         * @returns {Promise<void>} Promise that resolves after delay
         */
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // ================================================================
        // Simulation Control Functions
        // ================================================================

        /**
         * Runs the power flow simulation until convergence or max iterations.
         *
         * Main simulation loop that:
         *   1. Executes iterations with the selected algorithm
         *   2. Records convergence history for charting
         *   3. Updates all visualizations after each iteration
         *   4. Checks convergence against tolerance threshold
         *   5. Handles pause/resume functionality
         *
         * @async
         * @returns {Promise<void>}
         */
        async function runSimulation() {
            if (state.running) return;

            state.running = true;
            state.paused = false;
            state.stepMode = false;

            updateStatus('running', '実行中...');
            document.getElementById('runBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;

            while (state.running && state.iteration < state.maxIterations) {
                if (state.paused) {
                    await delay(100);
                    continue;
                }

                await runIteration();
                state.iteration++;
                
                const maxError = getMaxMismatch();
                state.convergenceHistory.push(maxError);
                
                document.getElementById('iterCount').textContent = state.iteration;
                document.getElementById('maxMismatch').textContent = maxError.toExponential(2);
                
                updateConvergenceChart();
                drawNetwork();
                updateBusTable();

                if (maxError < state.tolerance) {
                    state.running = false;
                    updateStatus('converged', `収束! (${state.iteration}回)`);
                    break;
                }

                await delay(200 / state.speed);
            }

            if (state.iteration >= state.maxIterations) {
                updateStatus('diverged', '最大反復数に到達');
            }

            document.getElementById('runBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
            state.running = false;
        }

        /**
         * Executes a single iteration step (manual step-through mode).
         *
         * Performs one power flow iteration and updates all displays.
         * Used for educational purposes to observe each iteration in detail.
         * Does not run if simulation is already running and not paused.
         *
         * @async
         * @returns {Promise<void>}
         */
        async function stepSimulation() {
            if (state.running && !state.paused) return;

            state.stepMode = true;
            updateStatus('running', 'ステップ実行...');

            await runIteration();
            state.iteration++;
            
            const maxError = getMaxMismatch();
            state.convergenceHistory.push(maxError);
            
            document.getElementById('iterCount').textContent = state.iteration;
            document.getElementById('maxMismatch').textContent = maxError.toExponential(2);
            
            updateConvergenceChart();
            drawNetwork();
            updateBusTable();

            if (maxError < state.tolerance) {
                updateStatus('converged', `収束! (${state.iteration}回)`);
            } else {
                updateStatus('idle', 'ステップ完了');
            }
        }

        /**
         * Toggles the pause state of a running simulation.
         *
         * When paused, the simulation loop continues but skips iteration execution.
         * Updates the pause button text and status indicator accordingly.
         */
        function togglePause() {
            state.paused = !state.paused;
            const btn = document.getElementById('pauseBtn');
            if (state.paused) {
                btn.textContent = '▶ 再開';
                updateStatus('idle', '一時停止中');
            } else {
                btn.textContent = '⏸ 一時停止';
                updateStatus('running', '実行中...');
            }
        }

        /**
         * Resets the simulation to initial state.
         *
         * Performs the following:
         *   1. Stops any running simulation
         *   2. Resets iteration counter and convergence history
         *   3. Reinitializes the network with original bus values
         *   4. Clears step indicators and equation display
         *   5. Redraws all visualizations
         */
        function resetSimulation() {
            state.running = false;
            state.paused = false;
            state.iteration = 0;
            state.convergenceHistory = [];
            state.currentStep = null;

            // Reset buses to initial state
            const networkId = document.getElementById('networkSelect').value;
            initNetwork(networkId);

            document.getElementById('iterCount').textContent = '0';
            document.getElementById('maxMismatch').textContent = '-';
            document.getElementById('runBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;

            // Reset step indicators
            document.querySelectorAll('.step-badge').forEach(badge => {
                badge.classList.remove('active', 'completed');
            });

            updateEquationDisplay('アルゴリズムを選択して実行してください');
            updateStatus('idle', '待機中');
            updateConvergenceChart();
            drawNetwork();
            updateBusTable();
        }

        /**
         * Updates the status indicator dot and text.
         *
         * @param {string} status - Status class ('running', 'converged', 'diverged', 'idle')
         * @param {string} text - Status message to display
         */
        function updateStatus(status, text) {
            const dot = document.getElementById('statusDot');
            dot.className = 'status-dot ' + status;
            document.getElementById('statusText').textContent = text;
        }

        // ================================================================
        // UI Update Functions
        // ================================================================

        /**
         * Updates the bus data table with current voltage and mismatch values.
         *
         * Displays for each bus:
         *   - Bus ID and type
         *   - Voltage magnitude |V| and phase angle δ
         *   - Power mismatches ΔP and ΔQ with visual bar indicators
         *
         * Bar colors indicate mismatch severity:
         *   - Green: < 10% (converging)
         *   - Orange: 10-50% (moderate)
         *   - Red: > 50% (high mismatch)
         */
        function updateBusTable() {
            const tbody = document.getElementById('busTableBody');
            tbody.innerHTML = '';

            state.buses.forEach(bus => {
                const mismatch = calculateBusMismatch(bus);
                const row = document.createElement('tr');

                const pMismatchPct = Math.min(Math.abs(mismatch.P) * 100, 100);
                const qMismatchPct = Math.min(Math.abs(mismatch.Q) * 100, 100);
                const pColor = pMismatchPct > 50 ? '#f85149' : pMismatchPct > 10 ? '#d29922' : '#3fb950';
                const qColor = qMismatchPct > 50 ? '#f85149' : qMismatchPct > 10 ? '#d29922' : '#3fb950';

                row.innerHTML = `
                    <td>${bus.id + 1}</td>
                    <td>${bus.type}</td>
                    <td>${bus.V.toFixed(4)}</td>
                    <td>${(bus.delta * 180 / Math.PI).toFixed(2)}°</td>
                    <td>
                        ${mismatch.P.toFixed(4)}
                        <div class="mismatch-bar">
                            <div class="mismatch-fill" style="width: ${pMismatchPct}%; background: ${pColor};"></div>
                        </div>
                    </td>
                    <td>
                        ${mismatch.Q.toFixed(4)}
                        <div class="mismatch-bar">
                            <div class="mismatch-fill" style="width: ${qMismatchPct}%; background: ${qColor};"></div>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        /**
         * Renders the convergence history chart.
         *
         * Draws a log-scale plot of the error (max mismatch) vs iteration number.
         * Features:
         *   - Logarithmic Y-axis for wide error range visualization
         *   - Tolerance threshold shown as dashed red line
         *   - Grid lines for readability
         *   - Interactive points showing each iteration's error
         */
        function updateConvergenceChart() {
            const canvas = document.getElementById('convergenceChart');
            const ctx = canvas.getContext('2d');
            const rect = canvas.parentElement.getBoundingClientRect();

            canvas.width = rect.width - 20;
            canvas.height = rect.height - 20;

            const width = canvas.width;
            const height = canvas.height;
            const padding = { top: 10, right: 10, bottom: 25, left: 45 };

            ctx.fillStyle = '#21262d';
            ctx.fillRect(0, 0, width, height);

            if (state.convergenceHistory.length === 0) {
                ctx.fillStyle = '#8b949e';
                ctx.font = '11px JetBrains Mono';
                ctx.textAlign = 'center';
                ctx.fillText('実行するとここに収束曲線が表示されます', width / 2, height / 2);
                return;
            }

            const data = state.convergenceHistory;
            const maxIter = Math.max(data.length, 10);
            const logData = data.map(d => Math.log10(Math.max(d, 1e-16)));
            const minLog = Math.min(...logData, Math.log10(state.tolerance)) - 1;
            const maxLog = Math.max(...logData) + 0.5;

            const xScale = (width - padding.left - padding.right) / maxIter;
            const yScale = (height - padding.top - padding.bottom) / (maxLog - minLog);

            // Grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= 4; i++) {
                const y = padding.top + i * (height - padding.top - padding.bottom) / 4;
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(width - padding.right, y);
                ctx.stroke();
            }

            // Tolerance line
            const tolY = padding.top + (maxLog - Math.log10(state.tolerance)) * yScale;
            ctx.strokeStyle = '#f85149';
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(padding.left, tolY);
            ctx.lineTo(width - padding.right, tolY);
            ctx.stroke();
            ctx.setLineDash([]);

            // Convergence curve
            ctx.strokeStyle = '#58a6ff';
            ctx.lineWidth = 2;
            ctx.beginPath();

            data.forEach((val, i) => {
                const x = padding.left + (i + 1) * xScale;
                const y = padding.top + (maxLog - Math.log10(Math.max(val, 1e-16))) * yScale;
                
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();

            // Points
            ctx.fillStyle = '#58a6ff';
            data.forEach((val, i) => {
                const x = padding.left + (i + 1) * xScale;
                const y = padding.top + (maxLog - Math.log10(Math.max(val, 1e-16))) * yScale;
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, 2 * Math.PI);
                ctx.fill();
            });

            // Labels
            ctx.fillStyle = '#8b949e';
            ctx.font = '9px JetBrains Mono';
            ctx.textAlign = 'center';
            ctx.fillText('反復回数', width / 2, height - 3);

            ctx.save();
            ctx.translate(12, height / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText('log₁₀(誤差)', 0, 0);
            ctx.restore();
        }

        /**
         * Handles mouse hover events on the network canvas.
         *
         * Detects when the mouse is over a bus node (within 30px radius)
         * and displays a tooltip with detailed bus information including:
         *   - Bus name and type
         *   - Voltage magnitude and phase angle
         *   - Specified P and Q values
         *   - Current power mismatches ΔP and ΔQ
         *
         * @param {MouseEvent} e - Mouse event from canvas
         */
        function handleCanvasHover(e) {
            const canvas = document.getElementById('networkCanvas');
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Check if hovering over a bus
            for (let i = 0; i < state.buses.length; i++) {
                const pos = state.busPositions[i];
                const dist = Math.sqrt((x - pos.x) ** 2 + (y - pos.y) ** 2);

                if (dist < 30) {
                    const bus = state.buses[i];
                    const mismatch = calculateBusMismatch(bus);

                    const tooltip = document.getElementById('tooltip');
                    tooltip.style.display = 'block';
                    tooltip.style.left = (e.clientX + 15) + 'px';
                    tooltip.style.top = (e.clientY + 15) + 'px';
                    tooltip.innerHTML = `
                        <div class="tooltip-title">${bus.name} (${bus.type})</div>
                        <div class="tooltip-content">
電圧: |V| = ${bus.V.toFixed(4)} p.u.
位相: δ = ${(bus.delta * 180 / Math.PI).toFixed(2)}°
P_spec = ${bus.Pspec.toFixed(3)} p.u.
Q_spec = ${bus.Qspec.toFixed(3)} p.u.
───────────────
ΔP = ${mismatch.P.toFixed(4)}
ΔQ = ${mismatch.Q.toFixed(4)}
                        </div>
                    `;
                    return;
                }
            }

            document.getElementById('tooltip').style.display = 'none';
        }

        // Resize handler
        window.addEventListener('resize', () => {
            drawNetwork();
            updateConvergenceChart();
        });
    </script>
</body>
</html>
